<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESIP-Sistemas - Central de Monitoramento</title>

    <style>
        /* Paleta de Cores: Azul Marinho Premium */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #071424;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container Principal */
        .container-app {
            background: #0d233a;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Identidade Visual ESIP-Sistemas */
        .marca-header {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .marca-sub {
            font-size: 12px;
            color: #74b9ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: block;
        }

        /* Inputs de Login da Central */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            color: #a4b0be;

            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #071424;
            border: 2px solid #1e3d59;
            border-radius: 12px;
            font-size: 16px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #74b9ff;
        }

        .btn-principal {
            width: 100%;
            padding: 15px;
            background: #74b9ff;
            color: #071424;
            border: none;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

        /* Lista de Histórico */
        .log-container {
            background: #071424;

            padding: 12px 10px;
            border-bottom: 1px solid #1e3d59;
            font-size: 14px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        /* Botões dinâmicos de mapa */
        .btn-ver-mapa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2ed573;
            color: #071424;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            width: max-content;
            margin-top: 2px;
        }

        .btn-ver-mapa:hover {
            background: #22b85d;
        }

        .btn-mapa-urgente {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            color: #ff4757;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* Tela de Alerta Urgente Crítico */
        .tela-alerta {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff4757;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            animation: piscarAlerta 0.4s infinite alternate;
        }

        @keyframes piscarAlerta {
            from {
                background: #ff4757;
            }

                background: #b33939;
            }
        }

        .btn-atender {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: #071424;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;

        /* Status da conexão */
        .status-conexao {
            font-size: 11px;
            margin-top: 10px;
            color: #a4b0be;
        }
    </style>
</head>

<body>

    <div class="container-app">

        <!-- Tela de Alerta Vermelho de Emergência -->
        <div id="tela-emergencia" class="tela-alerta">

            <h1 style="font-size: 36px; margin: 0 0 10px 0;">
                ⚠️ ALERTA!
            </h1>

            <h2
                id="mensagem-emergencia"
                style="font-size: 20px; margin: 0; font-weight: normal; text-transform: uppercase; text-align: center;"
            >
                CHAMADO RECEBIDO
            </h2>

            <p
                id="hora-emergencia"
                style="font-size: 16px; opacity: 0.8; margin: 5px 0 0 0;"
            ></p>

            <!-- Localização recebida do cliente -->
            <div id="container-mapa-urgente"></div>

            <button
                class="btn-atender"
                onclick="desligarAlarme()"
            >
                CONSEGUI ATENDER
            </button>

        </div>


        <!-- Cabeçalho ESIP -->
        <div class="marca-header">
            ESIP-Sistemas
        </div>

        <span class="marca-sub">
            Central de Monitoramento
        </span>


        <!-- LOGIN DA CENTRAL -->
        <div id="central-login">

            <p
                style="color: #a4b0be; font-size: 14px; margin-bottom: 25px;"
            >
                Sincronize com a chave do cliente para escutar os alertas.
            </p>

            <div class="input-group">

                <label>
                    CHAVE DO CLIENTE PARA MONITORAR
                </label>

                <input
                    type="text"
                    id="chave-monitorar"
                    placeholder="Ex: FARMACIA-TESTE"
                    autocomplete="off"
                >

            </div>

            <button
                class="btn-principal"
                onclick="conectarCentral()"
            >
                Ativar Escuta em Tempo Real
            </button>

        </div>


        <!-- PAINEL DE MONITORAMENTO ATIVO -->
        <div id="central-painel" class="escondido">

            <h3
                id="status-escuta"
                style="color: #2ed573; margin: 0 0 5px 0;"
            >
                ● MONITORANDO VIA
            </h3>

            <p
                id="nome-sala-ativa"
                style="color: #74b9ff; margin: 0 0 5px 0; font-weight: bold;"
            ></p>

            <div
                id="status-conexao"
                class="status-conexao"
            >
                Conectando...
            </div>


            <h4
                style="text-align: left; margin: 20px 0 8px 0; color: #a4b0be; font-size: 13px;"
            >
                Histórico de Eventos (Hoje):
            </h4>

            <div class="log-container">

                <ul
                    id="lista-eventos"
                    style="padding: 0; margin: 0;"
                ></ul>

            </div>

        </div>

    </div>


    <script>

        /* ==========================================
           VARIÁVEIS
        ========================================== */

        let socket = null;

        /*
         * Som de alerta.
         *
         * Mantido como áudio externo, porém o navegador
         * pode exigir interação do usuário para permitir
         * reprodução automática.
         */
        const somAlarme = new Audio(
            'https://google.com'
        );

        somAlarme.loop = true;


        /* ==========================================
           CONEXÃO COM A CENTRAL
        ========================================== */

        function conectarCentral() {

            const sala =
                document
                    .getElementById('chave-monitorar')
                    .value
                    .trim()
                    .toUpperCase();


            if (!sala) {

                alert(
                    "Digite a chave do cliente!"
                );

                return;
            }


            /* Fecha conexão anterior, se existir */

            if (
                socket &&
                socket.readyState !== WebSocket.CLOSED
            ) {

                socket.close();

            }


            /* Mostra painel */

            document
                .getElementById('central-login')
                .classList
                .add('escondido');


            document
                .getElementById('central-painel')
                .classList
                .remove('escondido');


            document
                .getElementById('nome-sala-ativa')
                .innerText = sala;


            document
                .getElementById('status-conexao')
                .innerText =
                "Conectando à central de transmissão...";


            document
                .getElementById('status-escuta')
                .innerText =
                "● CONECTANDO";


            document
                .getElementById('status-escuta')
                .style.color =
                "#ffa502";


            /*
             * IMPORTANTE:
             *
             * Esta URL precisa ser EXATAMENTE a mesma
             * utilizada pelo código do cliente.
             */

            const url =
                `wss://free.blr2.piesocket.com/v3/${encodeURIComponent(sala)}?api_key=VCXCEuvhGcBDP7XhiJZUDoxe9WwMDYvsBzctGqpO&notify_self=1`;


            try {

                socket = new WebSocket(url);

            }

            catch (erro) {

                console.error(
                    "Erro ao criar WebSocket:",
                    erro
                );

                mostrarErroConexao();

                return;
            }


            /* ==========================================
               CONEXÃO ABERTA
            ========================================== */

            socket.onopen = function() {

                console.log(
                    "Central conectada à sala:",
                    sala
                );


                document
                    .getElementById('status-escuta')
                    .innerText =
                    "● MONITORANDO VIA WEBSOCKET";


                document
                    .getElementById('status-escuta')
                    .style.color =
                    "#2ed573";


                document
                    .getElementById('status-conexao')
                    .innerText =
                    "✓ Conexão ativa — aguardando transmissão";

            };


            /* ==========================================
               RECEBIMENTO DA TRANSMISSÃO
            ========================================== */

            socket.onmessage = function(event) {

                console.log(
                    "Transmissão recebida:",
                    event.data
                );


                let dados;


                /*
                 * Tenta interpretar a mensagem como JSON.
                 */

                try {

                    dados =
                        JSON.parse(event.data);

                }

                catch (erro) {

                    console.error(
                        "Mensagem recebida não é JSON:",
                        event.data
                    );

                    return;
                }


                /*
                 * Confirma que é um alerta crítico.
                 */

                if (
                    dados.status !==
                    "ALERTA_CRITICO"
                ) {

                    return;
                }


                /* ======================================
                   DADOS BÁSICOS DO ALERTA
                ====================================== */

                const mensagem =
                    dados.mensagem ||
                    "CHAMADO RECEBIDO";


                const hora =
                    dados.hora ||
                    new Date()
                        .toLocaleTimeString('pt-BR');


                document
                    .getElementById(
                        'mensagem-emergencia'
                    )
                    .innerText =
                    `⚠️ ${mensagem.replace(/_/g, ' ')}`;


                document
                    .getElementById(
                        'hora-emergencia'
                    )
                    .innerText =
                    `Horário: ${hora}`;


                /* ======================================
                   RECEBIMENTO DO GPS
                ====================================== */

                const mapaUrgenteContainer =
                    document.getElementById(
                        'container-mapa-urgente'
                    );


                mapaUrgenteContainer.innerHTML = "";


                const gpsValido =
                    dados.localizacao &&
                    typeof dados.localizacao.latitude === "number" &&
                    typeof dados.localizacao.longitude === "number";


                if (gpsValido) {

                    /*
                     * Utiliza o mapa_link enviado pelo cliente
                     * quando existir.
                     *
                     * Se não existir, monta um novo link.
                     */

                    const mapaLink =
                        dados.localizacao.mapa_link ||
                        `https://www.google.com/maps?q=${dados.localizacao.latitude},${dados.localizacao.longitude}`;


                    mapaUrgenteContainer.innerHTML = `

                        <div
                            style="
                                font-size:12px;
                                font-weight:bold;
                                margin-top:10px;
                            "
                        >
                            📍 GPS RECEBIDO
                        </div>

                        <div
                            style="
                                font-size:11px;
                                margin-top:4px;
                                opacity:0.9;
                            "
                        >
                            Lat:
                            ${dados.localizacao.latitude.toFixed(5)}
                            <br>

                            Lon:
                            ${dados.localizacao.longitude.toFixed(5)}
                        </div>

                        <a
                            href="${mapaLink}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn-mapa-urgente"
                        >
                            📍 VER LOCALIZAÇÃO NO MAPA
                        </a>
                    `;

                }

                else {

                    mapaUrgenteContainer.innerHTML = `

                        <p
                            style="
                                font-size:13px;
                                font-weight:bold;
                                color:white;
                                margin:15px 0;
                            "
                        >
                            ⚠️ Dispositivo sem sinal de GPS
                        </p>

                    `;

                }


                /* ======================================
                   ABRE TELA DE EMERGÊNCIA
                ====================================== */

                document
                    .getElementById(
                        'tela-emergencia'
                    )
                    .style.display =
                    'flex';


                /* ======================================
                   SOM DE ALERTA
                ====================================== */

                somAlarme
                    .play()
                    .catch(function() {

                        console.log(
                            "Navegador aguardando interação para reproduzir o som."
                        );

                    });


                /* ======================================
                   HISTÓRICO
                ====================================== */

                const lista =
                    document.getElementById(
                        'lista-eventos'
                    );


                const li =
                    document.createElement('li');


                li.className =
                    'log-item';


                let linkHistoricoGps = "";


                if (gpsValido) {

                    const mapaLinkHistorico =
                        dados.localizacao.mapa_link ||
                        `https://www.google.com/maps?q=${dados.localizacao.latitude},${dados.localizacao.longitude}`;


                    linkHistoricoGps = `

                        <div
                            style="
                                color:#2ed573;
                                font-size:10px;
                                font-weight:bold;
                            "
                        >
                            📍 GPS RECEBIDO
                        </div>

                        <a
                            href="${mapaLinkHistorico}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn-ver-mapa"
                        >
                            🌐 Abrir Mapa
                        </a>

                    `;

                }

                else {

                    linkHistoricoGps = `

                        <span
                            style="
                                color:#a4b0be;
                                font-size:11px;
                            "
                        >
                            Sem GPS disponível
                        </span>

                    `;

                }


                li.innerHTML = `

                    <div>

                        <b
                            style="color:#ff4757;"
                        >
                            [${hora}]
                        </b>

                        ${mensagem.replace(/_/g, ' ')}

                    </div>

                    ${linkHistoricoGps}

                `;


                lista.prepend(li);

            };


            /* ==========================================
               ERRO DE CONEXÃO
            ========================================== */

            socket.onerror = function(erro) {

                console.error(
                    "Erro WebSocket:",
                    erro
                );

                mostrarErroConexao();

            };


            /* ==========================================
               CONEXÃO ENCERRADA
            ========================================== */

            socket.onclose = function() {

                console.log(
                    "Conexão WebSocket encerrada."
                );


                document
                    .getElementById(
                        'status-escuta'
                    )
                    .innerText =
                    "● CONEXÃO ENCERRADA";


                document
                    .getElementById(
                        'status-escuta'
                    )
                    .style.color =
                    "#ff4757";


                document
                    .getElementById(
                        'status-conexao'
                    )
                    .innerText =
                    "⚠️ Central desconectada";

            };

        }


        /* ==========================================
           ERRO DE CONEXÃO
        ========================================== */

        function mostrarErroConexao() {

            document
                .getElementById(
                    'status-escuta'
                )
                .innerText =
                "● ERRO DE CONEXÃO";


            document
                .getElementById(
                    'status-escuta'
                )
                .style.color =
                "#ff4757";


            document
                .getElementById(
                    'status-conexao'
                )
                .innerText =
                "⚠️ Não foi possível conectar ao servidor.";

        }


        /* ==========================================
           DESLIGAR ALARME
        ========================================== */

        function desligarAlarme() {

            somAlarme.pause();

            somAlarme.currentTime = 0;


            document
                .getElementById(
                    'tela-emergencia'
                )
                .style.display =
                'none';

        }


        /* ==========================================
           ENTER NO CAMPO DA CENTRAL
        ========================================== */

        document
            .getElementById(
                'chave-monitorar'
            )
            .addEventListener(
                'keydown',
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        conectarCentral();

                    }

                }
            );

    </script>

</body>
</html>
