<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESIP-Sistemas - Central de Monitoramento</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#071426;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:380px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#00d9ff;
    margin:10px 0 5px;
}

.subtitulo{
    text-align:center;
    color:#9fb4c8;
    font-size:13px;
    margin-bottom:25px;
}

.card{
    background:#0d2038;
    border:1px solid #193a5d;
    border-radius:15px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #315777;
    background:#06101e;
    color:#fff;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    margin-top:8px;
}

.btn-login{
    background:#00bfe8;
    color:#00131c;
}

.btn-mapa{
    background:#1685c7;
    color:#fff;
}

.btn-desligar{
    background:#333;
    color:#fff;
}

.hidden{
    display:none!important;
}

.status{
    margin:12px 0;
    padding:10px;
    border-radius:8px;
    background:#06101e;
    color:#9edfff;
    font-size:13px;
    text-align:center;
}

.historico{
    margin-top:15px;
}

.item{
    background:#06101e;
    border:1px solid #193a5d;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    font-size:13px;
}

.item strong{
    color:#ff4b4b;
}

.item a{
    color:#00d9ff;
    text-decoration:none;
}

.tela-alerta{
    position:fixed;
    inset:0;
    background:rgba(120,0,0,.96);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.tela-alerta.ativa{
    display:flex;
}

.alerta-box{
    width:100%;
    max-width:380px;
    background:#120000;
    border:3px solid red;
    border-radius:20px;
    padding:25px;
    text-align:center;
    animation:pulsar 1s infinite;
}

.alerta-titulo{
    font-size:30px;
    font-weight:bold;
    color:#fff;
    margin-bottom:20px;
}

.alerta-mensagem{
    font-size:22px;
    color:#ff7777;
    margin-bottom:15px;
}

.alerta-gps{
    font-size:13px;
    line-height:1.7;
    color:#fff;
    word-break:break-word;
}

@keyframes pulsar{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

}

.logo{
    text-align:center;
    font-size:28px;
}

</style>
</head>

<body>

<div id="telaAlerta" class="tela-alerta">

    <div class="alerta-box">

        <div class="alerta-titulo">
            🚨 ALERTA RECEBIDO
        </div>

        <div
            id="alertaMensagem"
            class="alerta-mensagem">
        </div>

        <div
            id="alertaGPS"
            class="alerta-gps">
        </div>

        <button
            id="btnMapaAlerta"
            class="btn-mapa"
            onclick="abrirMapaAlerta()">
            📍 VER LOCALIZAÇÃO NO MAPA
        </button>

        <button
            class="btn-desligar"
            onclick="desligarAlarme()">
            🔕 DESLIGAR ALARME
        </button>

    </div>

</div>

<div class="container">

    <div class="logo">📡</div>

    <h1>
        ESIP-Sistemas
    </h1>

    <div class="subtitulo">
        Central de Monitoramento
    </div>

    <div
        id="centralLogin"
        class="card">

        <h3 style="text-align:center;">
            Conectar Cliente
        </h3>

        <input
            type="text"
            id="chaveMonitorar"
            placeholder="Digite a licença do cliente"
            autocomplete="off"
        >

        <button
            class="btn-login"
            onclick="conectarCentral()">

            CONECTAR

        </button>

    </div>

    <div
        id="centralPainel"
        class="hidden">

        <div class="card">

            <h3
                id="nomeSalaAtiva"
                style="text-align:center;">
            </h3>

            <div
                id="statusConexao"
                class="status">

                🔴 Desconectado

            </div>

            <div
                id="ultimoAlerta"
                class="status">

                Aguardando alertas...

            </div>

            <div class="historico">

                <h3>
                    Histórico
                </h3>

                <div id="historicoLista">

                    Nenhum alerta recebido.

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const API_KEY =
"COLOQUE_AQUI_A_MESMA_API_KEY_DO_SEU_PIESOCKET";

let socket = null;

let salaAtiva = null;

let ultimoMapa = null;

let audioContext = null;

let oscilador = null;


function conectarCentral(){

    const campo =
        document.getElementById(
            "chaveMonitorar"
        );

    const sala =
        campo.value
        .trim()
        .toUpperCase();

    if(!sala){

        alert(
            "Digite a chave/licença do cliente."
        );

        return;
    }

    salaAtiva = sala;

    if(
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ){

        socket.close();

    }

    document
        .getElementById("centralLogin")
        .classList.add("hidden");

    document
        .getElementById("centralPainel")
        .classList.remove("hidden");

    document
        .getElementById("nomeSalaAtiva")
        .innerText =
        "Cliente: " + sala;

    document
        .getElementById("statusConexao")
        .innerText =
        "🟡 Conectando...";

    const url =
        "wss://free.blr2.piesocket.com/v3/" +
        encodeURIComponent(sala) +
        "?api_key=" +
        encodeURIComponent(API_KEY) +
        "&notify_self=1";

    try{

        socket =
            new WebSocket(url);

        socket.onopen =
            function(){

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🟢 CENTRAL CONECTADA";

                prepararAudio();

                console.log(
                    "WebSocket conectado."
                );

            };

        socket.onerror =
            function(erro){

                console.error(
                    "WebSocket erro:",
                    erro
                );

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🔴 ERRO NA CONEXÃO";

            };

        socket.onclose =
            function(){

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🔴 CONEXÃO ENCERRADA";

            };

        socket.onmessage =
            function(event){

                console.log(
                    "DADOS RECEBIDOS:",
                    event.data
                );

                receberAlerta(
                    event.data
                );

            };

    }

    catch(erro){

        console.error(erro);

        document
            .getElementById("statusConexao")
            .innerText =
            "🔴 FALHA AO CONECTAR";

    }

}


function receberAlerta(mensagem){

    let dados;

    try{

        dados =
            JSON.parse(mensagem);

    }

    catch(erro){

        console.warn(
            "Mensagem não é JSON:",
            mensagem
        );

        return;
    }

    if(
        !dados ||
        dados.status !== "ALERTA_CRITICO"
    ){

        return;
    }

    const texto =
        dados.mensagem ||
        "CHAMADO RECEBIDO";

    const hora =
        dados.hora ||
        new Date()
        .toLocaleTimeString("pt-BR");

    const localizacao =
        dados.localizacao;

    let gpsTexto =
        "⚠️ GPS não recebido";

    let mapaLink = null;

    if(localizacao){

        const lat =
            Number(localizacao.latitude);

        const lon =
            Number(localizacao.longitude);

        if(
            Number.isFinite(lat) &&
            Number.isFinite(lon)
        ){

            gpsTexto =
                "📍 Latitude: " +
                lat.toFixed(6) +
                "<br>" +
                "📍 Longitude: " +
                lon.toFixed(6);

            if(
                typeof localizacao.mapa_link ===
                "string" &&
                localizacao.mapa_link.length > 0
            ){

                mapaLink =
                    localizacao.mapa_link;

            }

            else{

                mapaLink =
                    "https://www.google.com/maps?q=" +
                    lat +
                    "," +
                    lon;

            }

        }

    }

    ultimoMapa =
        mapaLink;

    document
        .getElementById("alertaMensagem")
        .innerText =
        texto;

    document
        .getElementById("alertaGPS")
        .innerHTML =
        gpsTexto;

    const botaoMapa =
        document
        .getElementById("btnMapaAlerta");

    if(mapaLink){

        botaoMapa.style.display =
            "block";

    }

    else{

        botaoMapa.style.display =
            "none";

    }

    document
        .getElementById("telaAlerta")
        .classList.add("ativa");

    document
        .getElementById("ultimoAlerta")
        .innerText =
        "🚨 " +
        texto +
        " — " +
        hora;

    adicionarHistorico(
        dados,
        gpsTexto,
        mapaLink
    );

    tocarAlarme();

}


function adicionarHistorico(
    dados,
    gpsTexto,
    mapaLink
){

    const lista =
        document
        .getElementById(
            "historicoLista"
        );

    if(
        lista.innerText.trim() ===
        "Nenhum alerta recebido."
    ){

        lista.innerHTML = "";

    }

    const item =
        document.createElement("div");

    item.className =
        "item";

    let mapaHTML = "";

    if(mapaLink){

        mapaHTML =
            "<br><br>" +
            "<a href=\"" +
            mapaLink +
            "\" target=\"_blank\">" +
            "📍 Abrir localização no mapa" +
            "</a>";

    }

    item.innerHTML =

        "<strong>" +
        (dados.mensagem ||
        "ALERTA") +
        "</strong>" +

        "<br><br>" +

        "Horário: " +
        (dados.hora ||
        "--") +

        "<br><br>" +

        gpsTexto +

        mapaHTML;

    lista.prepend(item);

}


function abrirMapaAlerta(){

    if(!ultimoMapa){

        alert(
            "Nenhuma localização GPS disponível."
        );

        return;
    }

    window.open(
        ultimoMapa,
        "_blank"
    );

}


function prepararAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }

    catch(erro){

        console.warn(
            "Áudio não disponível:",
            erro
        );

    }

}


function tocarAlarme(){

    try{

        prepararAudio();

        if(!audioContext){

            return;
        }

        if(oscilador){

            try{
                oscilador.stop();
            }catch(e){}

        }

        oscilador =
            audioContext
            .createOscillator();

        const ganho =
            audioContext
            .createGain();

        oscilador.type =
            "square";

        oscilador.frequency.value =
            900;

        ganho.gain.value =
            0.08;

        oscilador.connect(ganho);

        ganho.connect(
            audioContext.destination
        );

        oscilador.start();

    }

    catch(erro){

        console.warn(
            "Não foi possível iniciar o som.",
            erro
        );

    }

}


function desligarAlarme(){

    try{

        if(oscilador){

            oscilador.stop();

            oscilador.disconnect();

            oscilador = null;

        }

    }

    catch(e){}

    document
        .getElementById(
            "telaAlerta"
        )
        .classList.remove("ativa");

}


document
    .getElementById(
        "chaveMonitorar"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                conectarCentral();

            }

        }
    );

</script>

</body>
</html>
