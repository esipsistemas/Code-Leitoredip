<meta charset="utf-8">

<title>ESIP Sistemas</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{min-height:100vh;display:grid;place-items:center}
#esip{width:112px;height:112px;position:relative;display:grid;place-items:center;
 cursor:pointer;user-select:none; -webkit-tap-highlight-color:transparent}
.shield{position:absolute;top:7px;width:65px;height:65px;
 background:linear-gradient(145deg,#0b3768,#031326);
 border:4px solid #42baff;clip-path:polygon(50% 0,100% 19%,91% 72%,50% 100%,9% 72%,0 19%);
 display:grid;place-items:center;filter:drop-shadow(0 0 7px #078dff)}
.tower{width:28px;height:35px;position:relative;margin-top:5px;
 background:linear-gradient(90deg,#65d9ff,#0875d9);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tower:after{content:"";position:absolute;inset:8px 11px 0;background:#06264a;
 clip-path:polygon(50% 0,100% 100%,0 100%)}
.wave{position:absolute;border:3px solid #6bdcff;border-top-color:transparent;
 border-bottom-color:transparent;border-radius:50%;width:22px;height:32px;top:16px}
.wave.left{left:9px} .wave.right{right:9px}
.orbit{position:absolute;width:108px;height:34px;border:4px solid #168cff;
 border-left-color:#7ce8ff;border-radius:50%;transform:rotate(-22deg);
 box-shadow:0 0 9px #008cff;animation:spin 4s linear infinite}
.word{position:absolute;bottom:8px;color:#f3fbff;font:bold 23px Arial,sans-serif;
 letter-spacing:-1px;text-shadow:0 0 8px #168cff}
.sub{position:absolute;bottom:0px;color:#8bdcff;font:7px Arial,sans-serif;letter-spacing:3px}
#esip:active{transform:scale(.96)}
@keyframes spin{to{transform:rotate(338deg)}}
</style>
</head>
