<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06152b"><title>ESIP | Portal de chamada</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background-color:#030b17;background-image:linear-gradient(#0b2c4c44 1px,transparent 1px),linear-gradient(90deg,#0b2c4c44 1px,transparent 1px),radial-gradient(ellipse at center,#0a2b4c,#020812 70%);background-size:32px 32px,32px 32px,auto;font-family:Arial,sans-serif;color:#f1f9ff}.wrap{width:min(100%,430px);border-radius:22px;padding:3px;background:linear-gradient(135deg,#00d9ff,#1c5fa8,#00d9ff);box-shadow:0 0 32px #00aaff25}.panel{border-radius:20px;padding:36px 24px 25px;background:linear-gradient(150deg,#081d35,#030b17);text-align:center}.orb{margin:0 auto 20px;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;border:1px solid #00d9ff;color:#00d9ff;font-size:36px;background:radial-gradient(circle,#0c3c5c,#06152b);box-shadow:0 0 0 8px #00d9ff0b,0 0 0 17px #00d9ff07,0 0 26px #00d9ff33}h1{font-size:31px;letter-spacing:.2em;margin:0}.kicker{color:#00d9ff;font-size:10px;letter-spacing:.22em;margin-top:10px}.line{height:1px;background:linear-gradient(90deg,transparent,#00d9ff,transparent);margin:26px 0}.title{font-size:22px;font-weight:800;letter-spacing:.08em}.desc{font-size:14px;line-height:1.65;color:#9ebedc}.meter{display:flex;align-items:center;justify-content:center;gap:6px;height:65px;margin:18px 0}.meter span{width:5px;height:var(--h);border-radius:5px;background:linear-gradient(#7af0ff,#168aff);box-shadow:0 0 12px #00d9ff88;animation:meter .9s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes meter{to{transform:scaleY(.3);opacity:.6}}.btn{display:block;padding:18px 12px;border:1px solid #00d9ff;border-radius:12px;color:#031323;background:linear-gradient(90deg,#00c9ff,#80f1ff);font-size:13px;font-weight:900;letter-spacing:.09em;text-decoration:none;box-shadow:0 0 22px #00d9ff2b}.hint{display:none;color:#ffe1a0;font-size:12px;margin-top:13px}.fine{margin-top:23px;color:#668db3;font-size:10px;letter-spacing:.15em}
</style></head><body><main class="wrap"><div class="panel"><div class="orb">⌁</div><h1>ESIP</h1><div class="kicker">PORTAL DE COMUNICAÇÃO</div><div class="line"></div><div class="title">LINHA 2 · CHAMADA RECEBIDA</div><p class="desc">O acesso ao ambiente de comunicação está pronto.<br>Use o botão abaixo para prosseguir.</p><div class="meter"><span style="--h:15px;--d:-0.00s"></span><span style="--h:26px;--d:-0.10s"></span><span style="--h:38px;--d:-0.20s"></span><span style="--h:21px;--d:-0.30s"></span><span style="--h:52px;--d:-0.40s"></span><span style="--h:33px;--d:-0.50s"></span><span style="--h:43px;--d:-0.60s"></span><span style="--h:24px;--d:-0.70s"></span><span style="--h:36px;--d:-0.80s"></span><span style="--h:17px;--d:-0.90s"></span><span style="--h:29px;--d:-1.00s"></span></div><a id="botao-atender" class="btn" href="#">ABRIR COMUNICAÇÃO ESIP&nbsp; ↗</a><div id="aviso-link" class="hint">Insira o endereço do motor no campo LINK_DO_MOTOR_ESIP, no final do HTML.</div><div class="fine">AZUL-MARINHO · TECNOLOGIA NÉON · ESIP</div></div></main>
<script>
  // Substitua o texto abaixo pelo endereço completo do motor ESIP.
  const LINK_DO_MOTOR_ESIP = "COLE_AQUI_O_LINK_DO_MOTOR";
  const botao = document.getElementById("botao-atender");
  const aviso = document.getElementById("aviso-link");
  botao.addEventListener("click", function (evento) {
    evento.preventDefault();
    if (!LINK_DO_MOTOR_ESIP || LINK_DO_MOTOR_ESIP === "COLE_AQUI_O_LINK_DO_MOTOR") {
      aviso.style.display = "block";
      return;
    }
    window.location.href = LINK_DO_MOTOR_ESIP;
  });
</script>
</body></html>
