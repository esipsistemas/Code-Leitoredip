<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041226"><title>ESIP | Ligação recebida</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(160deg,#020916,#071f3b 55%,#020916);font-family:Arial,sans-serif;color:#f4fbff}.phone{width:min(100%,390px);min-height:690px;border:1px solid #1c9bdb;border-radius:38px;padding:30px 23px 25px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(circle at 50% 40%,#0d3760 0,#071b32 43%,#030d1d 80%);box-shadow:0 0 35px #007fc533,inset 0 0 20px #00d9ff0d;text-align:center}.top{width:100%;display:flex;justify-content:space-between;color:#6eb6e6;font-size:10px;letter-spacing:.12em}.ring{margin-top:20px;width:130px;height:130px;border:1px solid #00d9ff;border-radius:50%;display:grid;place-items:center;color:#00d9ff;font-size:46px;box-shadow:0 0 0 12px #00d9ff0b,0 0 0 25px #00d9ff08,0 0 30px #00d9ff2a;animation:ring 2.4s ease-out infinite}@keyframes ring{50%{box-shadow:0 0 0 18px #00d9ff05,0 0 0 36px #00d9ff04,0 0 35px #00d9ff44}}.small{margin-top:36px;color:#00d9ff;font-size:11px;letter-spacing:.22em}h1{font-size:30px;letter-spacing:.14em;margin:12px 0 6px}.desc{color:#a4c5e4;font-size:14px;line-height:1.6}.signal{display:flex;gap:4px;align-items:center;height:45px}.signal i{width:3px;height:var(--h);background:#4bdfff;border-radius:4px;box-shadow:0 0 8px #00d9ff;animation:wave .7s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes wave{to{transform:scaleY(.35);opacity:.5}}.btn{width:100%;padding:18px 10px;border-radius:40px;background:#00d9ff;color:#031426;text-decoration:none;font-weight:800;letter-spacing:.06em;box-shadow:0 0 24px #00d9ff33}.hint{display:none;color:#ffe4a6;font-size:12px;line-height:1.5}.foot{color:#638bb0;font-size:10px;letter-spacing:.18em}
</style></head><body><main class="phone"><div class="top"><span>ESIP SECURE WEB</span><span>LINHA 02</span></div><div class="ring" aria-hidden="true">☎</div><section><div class="small">CHAMADA ESIP</div><h1>LINHA 2</h1><p class="desc">Toque no botão para continuar<br>para o ambiente de comunicação.</p></section><div class="signal"><i style="--h:12px;--d:-0.00s"></i><i style="--h:22px;--d:-0.12s"></i><i style="--h:32px;--d:-0.25s"></i><i style="--h:18px;--d:-0.38s"></i><i style="--h:40px;--d:-0.50s"></i><i style="--h:26px;--d:-0.62s"></i><i style="--h:34px;--d:-0.75s"></i><i style="--h:16px;--d:-0.88s"></i><i style="--h:27px;--d:-1.00s"></i><i style="--h:13px;--d:-1.12s"></i></div><a id="botao-atender" class="btn" href="#">↗ ATENDER / ABRIR ESIP</a><div id="aviso-link" class="hint">O link do motor ainda não foi inserido. Edite LINK_DO_MOTOR_ESIP no código.</div><div class="foot">CONEXÃO WEB · ESIP</div></main>
<script>
  // Substitua o texto abaixo pelo endereço completo do motor ESIP.
  const LINK_DO_MOTOR_ESIP = "COLE_AQUI_O_LINK_DO_MOTOR";
  const botao = document.getElementById("botao-atender");
  const aviso = document.getElementById("aviso-link");
  botao.addEventListener("click", function (evento) {
    evento.preventDefault();
    if (!LINK_DO_MOTOR_ESIP || LINK_DO_MOTOR_ESIP === "COLE_AQUI_O_LINK_DO_MOTOR") {
      aviso.style.display = "block";
      return;
    }
    window.location.href = LINK_DO_MOTOR_ESIP;
  });
</script>
</body></html>
