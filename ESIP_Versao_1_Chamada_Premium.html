<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06152b"><title>ESIP | Linha 2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#103a61,#030b17 65%);font-family:Arial,sans-serif;color:#f3faff}.card{width:min(100%,410px);padding:34px 25px 25px;border:1px solid #00d9ff;border-radius:28px;background:linear-gradient(150deg,#0b2744,#04101f);box-shadow:0 0 28px #00bfff22;text-align:center}.logo{margin:auto auto 16px;width:72px;height:72px;display:grid;place-items:center;border:1px solid #00d9ff;border-radius:22px;color:#00d9ff;font-size:32px;box-shadow:0 0 22px #00d9ff33}h1{margin:0;letter-spacing:.2em;font-size:32px} .tag{margin-top:8px;color:#91badc;letter-spacing:.16em;font-size:10px}.label{margin-top:50px;color:#00d9ff;font-weight:bold;font-size:11px;letter-spacing:.2em}h2{font-size:25px;margin:12px 0}.desc{color:#a8c5df;font-size:14px;line-height:1.6}.waves{height:70px;display:flex;align-items:center;justify-content:center;gap:5px;margin:22px}.waves i{width:4px;height:var(--h);border-radius:8px;background:#00d9ff;box-shadow:0 0 10px #00d9ff;animation:pulse .8s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes pulse{to{transform:scaleY(.4);opacity:.6}}.btn{display:flex;justify-content:center;align-items:center;gap:10px;padding:18px 12px;border-radius:14px;background:linear-gradient(90deg,#00d9ff,#7aeeff);color:#031324;text-decoration:none;font-weight:800;letter-spacing:.06em}.note{display:none;color:#ffe3a0;font-size:12px;margin-top:14px}.foot{margin-top:38px;color:#6288ac;font-size:10px;letter-spacing:.16em}
</style></head><body><main class="card"><div class="logo">◉</div><h1>ESIP</h1><div class="tag">COMUNICAÇÃO INTEGRADA</div><div class="label">CHAMADA RECEBIDA</div><h2>LINHA 2</h2><p class="desc">Sua comunicação está pronta.<br>Toque para abrir o ambiente ESIP.</p><div class="waves"><i style="--h:18px;--d:-0.00s"></i><i style="--h:32px;--d:-0.11s"></i><i style="--h:48px;--d:-0.22s"></i><i style="--h:26px;--d:-0.33s"></i><i style="--h:60px;--d:-0.44s"></i><i style="--h:38px;--d:-0.56s"></i><i style="--h:52px;--d:-0.67s"></i><i style="--h:25px;--d:-0.78s"></i><i style="--h:42px;--d:-0.89s"></i><i style="--h:30px;--d:-1.00s"></i><i style="--h:17px;--d:-1.11s"></i></div><a id="botao-atender" class="btn" href="#">☎ ATENDER CHAMADA</a><div id="aviso-link" class="note">Insira o endereço do motor no código, no campo LINK_DO_MOTOR_ESIP.</div><div class="foot">ESIP · CONEXÃO WEB</div></main>
<script>
  // Substitua o texto abaixo pelo endereço completo do motor ESIP.
  const LINK_DO_MOTOR_ESIP = "COLE_AQUI_O_LINK_DO_MOTOR";
  const botao = document.getElementById("botao-atender");
  const aviso = document.getElementById("aviso-link");
  botao.addEventListener("click", function (evento) {
    evento.preventDefault();
    if (!LINK_DO_MOTOR_ESIP || LINK_DO_MOTOR_ESIP === "COLE_AQUI_O_LINK_DO_MOTOR") {
      aviso.style.display = "block";
      return;
    }
    window.location.href = LINK_DO_MOTOR_ESIP;
  });
</script>
</body></html>
