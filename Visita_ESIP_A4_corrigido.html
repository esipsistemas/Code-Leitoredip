<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152e">
<title>ESIP | Registro de Visita Técnica</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --navy:#06142b;
  --navy2:#0b2142;
  --blue:#159bff;
  --cyan:#54d8ff;
  --text:#eaf5ff;
  --muted:#9db4d1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top,#123765 0%,transparent 55%),
    linear-gradient(145deg,#030914,#071a35 55%,#030914);
  padding:22px 14px 36px;
}
.app{width:100%;max-width:620px;margin:0 auto}
.brand{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:0 auto 20px;text-align:left
}
.brand-mark{
  width:48px;height:48px;flex:0 0 48px;border:1px solid var(--cyan);
  border-radius:14px;display:grid;place-items:center;color:var(--cyan);
  font-size:23px;font-weight:800;text-shadow:0 0 12px var(--blue);
  box-shadow:0 0 18px #159bff55,inset 0 0 14px #159bff22
}
.brand-name{font-size:22px;font-weight:800;letter-spacing:3px;color:#fff}
.brand-sub{font-size:10px;letter-spacing:2px;color:var(--cyan);margin-top:4px}
h1{font-size:19px;text-align:center;margin:0 0 18px;color:#fff}
.panel{
  width:100%;padding:18px;border:1px solid #168fe866;border-radius:18px;
  background:linear-gradient(155deg,#0d2342ee,#07152eee);
  box-shadow:0 12px 35px #0008,0 0 22px #087bd522
}
.field{width:100%;margin:0 0 12px;text-align:left}
.field label{display:block;margin:0 0 6px 2px;color:#a9dfff;font-size:12px;font-weight:700}
input,textarea{
  display:block;width:100%;max-width:100%;min-width:0;margin:0;
  padding:13px 14px;border-radius:10px;border:1px solid #28517b;
  background:#061329;color:#fff;font:inherit;font-size:15px;
  outline:none;box-shadow:inset 0 1px 5px #0005
}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #159bff30,0 0 12px #159bff33}
input::placeholder,textarea::placeholder{color:#7892b1}
input[type=file]{font-size:13px;padding:10px}
textarea{min-height:112px;resize:vertical;line-height:1.45;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{
  width:100%;min-width:0;margin:0;padding:14px 10px;border-radius:11px;
  border:1px solid #36baff88;font-weight:800;font-size:13px;letter-spacing:.4px;
  color:#fff;background:linear-gradient(135deg,#123d70,#087dc5);
  box-shadow:0 4px 15px #008cff25;cursor:pointer
}
button:active{transform:scale(.98)}
#start{background:linear-gradient(135deg,#075b66,#078eaa)}
#end{background:linear-gradient(135deg,#6d2638,#b12e4b)}
#pdf{grid-column:1/-1;background:linear-gradient(135deg,#0752a0,#087fc9)}
.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin:14px 4px 0}
#status{margin-top:12px;text-align:center;color:var(--cyan);font-size:12px;min-height:16px}
#relatorio{display:none;width:100%;overflow:visible}

/* Relatório compacto: largura útil A4 e elementos que não quebram */
.relatorio{
  position:relative;width:190mm;max-width:190mm;margin:0 auto;
  padding:6mm;background:#fff;color:#142033;
  font-family:Arial,Helvetica,sans-serif;font-size:9px;
  line-height:1.2;overflow:visible;overflow-wrap:anywhere
}
.relatorio *{box-sizing:border-box;max-width:100%}
.relatorio .topo{display:flex;align-items:center;gap:9px;min-width:0}
.relatorio .logo{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
.relatorio .topo h2{font-size:16px;margin:0 0 3px;overflow-wrap:anywhere}
.relatorio .topo p{margin:0;color:#31506f;font-weight:bold;letter-spacing:.6px;font-size:8px}
.relatorio hr{border:0;border-top:1.5px solid #168fe8;margin:7px 0}
.relatorio .grid{display:flex;gap:6px;margin:5px 0;width:100%;break-inside:avoid;page-break-inside:avoid}
.relatorio .grid>div{flex:1 1 0;min-width:0;background:#edf3f8;padding:6px;border-radius:5px;overflow-wrap:anywhere}
.relatorio .box{background:#edf3f8;padding:7px;border-radius:5px;margin:6px 0;overflow-wrap:anywhere;word-break:break-word;break-inside:avoid;page-break-inside:avoid}
.relatorio h3{font-size:10px;color:#0b477e;margin:7px 0 4px;break-after:avoid;page-break-after:avoid}
.relatorio .fotos{display:flex;gap:7px;width:100%;align-items:center;break-inside:avoid;page-break-inside:avoid}
.relatorio .fotos img{display:block;width:calc(50% - 4px);height:100px;min-width:0;flex:1 1 0;object-fit:contain;background:#e8edf2;border-radius:5px;border:1px solid #d4dde6}
.relatorio #qrs{display:flex;justify-content:center;align-items:center;margin:4px auto}
.relatorio #qrs img,.relatorio #qrs canvas{width:65px!important;height:65px!important}
.relatorio .carimbo{position:absolute;top:42%;left:25%;transform:rotate(-20deg);font-size:20px;color:#159bff24;border:2px solid #159bff24;padding:6px;font-weight:800;pointer-events:none}
.relatorio a{color:#075da5;overflow-wrap:anywhere}
.relatorio .hash{font-family:monospace;word-break:break-all}
@media(max-width:480px){
  body{padding:16px 10px 28px}
  .panel{padding:14px;border-radius:15px}
  .brand-name{font-size:20px}
  .actions{grid-template-columns:1fr}
  #pdf{grid-column:auto}
  button{padding:14px}
}
/* Evita que o conteúdo digitado ou links longos provoquem rolagem lateral */
input,textarea,.field,.panel{overflow-wrap:anywhere}
</style>
</head>

<body>
<main class="app">
  <header class="brand">
    <div class="brand-mark">E</div>
    <div>
      <div class="brand-name">ESIP</div>
      <div class="brand-sub">ENGENHARIA • TECNOLOGIA • SEGURANÇA</div>
    </div>
  </header>

  <h1>REGISTRO DE VISITA TÉCNICA</h1>

  <section class="panel">
    <div class="field">
      <label for="empresa">EMPRESA</label>
      <input id="empresa" placeholder="Nome da empresa" autocomplete="organization">
    </div>
    <div class="field">
      <label for="cliente">CLIENTE / LOCAL</label>
      <input id="cliente" placeholder="Nome do cliente ou local">
    </div>
    <div class="field">
      <label for="tecnico">RESPONSÁVEL TÉCNICO</label>
      <input id="tecnico" placeholder="Nome do responsável">
    </div>
    <div class="field">
      <label for="video">LINK DO VÍDEO (OPCIONAL)</label>
      <input id="video" type="url" placeholder="https://...">
    </div>
    <div class="field">
      <label for="logoInput">LOGO DA EMPRESA (OPCIONAL)</label>
      <input type="file" id="logoInput" accept="image/*">
    </div>
    <div class="field">
      <label for="obs">OBSERVAÇÕES</label>
      <textarea id="obs" placeholder="Digite as informações da visita..."></textarea>
    </div>

    <div class="actions">
      <button id="start" type="button">INICIAR VISITA</button>
      <button id="end" type="button">FINALIZAR VISITA</button>
      <button id="pdf" type="button">GERAR RELATÓRIO PDF</button>
    </div>
    <div id="status" role="status"></div>
    <p class="note">O registro utiliza GPS e câmera do dispositivo. Permita o acesso quando solicitado.</p>
  </section>
</main>

<input type="file" id="camera" hidden accept="image/*" capture="environment">
<div id="relatorio"></div>

<script>
"use strict";
let dados = {};
let logoBase64 = "";

const $ = id => document.getElementById(id);
const empresa = $("empresa");
const cliente = $("cliente");
const tecnico = $("tecnico");
const video = $("video");
const obs = $("obs");
const logoInput = $("logoInput");
const camera = $("camera");
const start = $("start");
const end = $("end");
const pdf = $("pdf");
const relatorio = $("relatorio");

function status(msg){ $("status").textContent = msg; }

logoInput.onchange = e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => { logoBase64 = ev.target.result; status("Logo carregada."); };
  r.readAsDataURL(file);
};

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation) return reject("GPS não disponível neste dispositivo.");
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>reject("Não foi possível obter a localização. Ative o GPS e autorize o acesso."),
      {enableHighAccuracy:true,timeout:20000,maximumAge:0}
    );
  });
}

function comprimir(base64){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");
      const max=1000;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL("image/jpeg",0.78));
    };
    img.onerror=()=>reject("Não foi possível processar a foto.");
    img.src=base64;
  });
}

function tirarFoto(){
  return new Promise((resolve,reject)=>{
    camera.value="";
    camera.onchange=async ()=>{
      if(!camera.files || !camera.files[0]) return reject("Foto cancelada.");
      const r=new FileReader();
      r.onload=async e=>{
        try{ resolve(await comprimir(e.target.result)); }
        catch(err){ reject(err); }
      };
      r.onerror=()=>reject("Erro ao ler imagem.");
      r.readAsDataURL(camera.files[0]);
    };
    camera.click();
  });
}

function gerarHash(d){
  const base=JSON.stringify(d)+navigator.userAgent;
  let hash=0;
  for(let i=0;i<base.length;i++){hash=((hash<<5)-hash)+base.charCodeAt(i);hash|=0;}
  return "CHK-"+Math.abs(hash);
}

start.onclick=async()=>{
  start.disabled=true; status("Obtendo localização e aguardando fotografia...");
  try{
    const loc=await getLocation();
    const foto=await tirarFoto();
    dados={
      id:"REL-"+Date.now(),
      empresa:empresa.value.trim(),
      cliente:cliente.value.trim(),
      tecnico:tecnico.value.trim(),
      video:video.value.trim(),
      logo:logoBase64,
      inicio:new Date().toLocaleString("pt-BR"),
      lat_inicio:loc.lat,lng_inicio:loc.lng,
      foto_inicio:foto,obs_inicio:obs.value.trim()
    };
    localStorage.setItem("visita",JSON.stringify(dados));
    status("Visita iniciada e registro salvo neste dispositivo.");
    alert("Visita iniciada com sucesso!");
  }catch(e){status("");alert(e);}
  finally{start.disabled=false;}
};

end.onclick=async()=>{
  end.disabled=true; status("Obtendo localização final e aguardando fotografia...");
  try{
    const d=JSON.parse(localStorage.getItem("visita")||"null");
    if(!d) throw "Inicie a visita antes de finalizar.";
    const loc=await getLocation();
    const foto=await tirarFoto();
    d.fim=new Date().toLocaleString("pt-BR");
    d.lat_fim=loc.lat;d.lng_fim=loc.lng;
    d.foto_fim=foto;d.obs_fim=obs.value.trim();
    localStorage.setItem("final",JSON.stringify(d));
    status("Visita finalizada. Relatório pronto para gerar.");
    alert("Visita finalizada com sucesso!");
  }catch(e){status("");alert(e);}
  finally{end.disabled=false;}
};

pdf.onclick=async()=>{
  let d;
  try{d=JSON.parse(localStorage.getItem("final")||"null");}
  catch{d=null;}
  if(!d){alert("Finalize a visita antes de gerar o PDF.");return;}
  if(typeof html2pdf==="undefined" || typeof QRCode==="undefined"){
    alert("Não foi possível carregar os recursos do PDF/QR Code. Verifique a conexão e tente novamente.");return;
  }

  pdf.disabled=true;status("Preparando relatório PDF...");
  const hash=gerarHash(d);
  const safe = value => String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  relatorio.innerHTML=`
    <div class="relatorio" id="pdfContent">
      <div class="topo">
        ${d.logo?`<img class="logo" src="${d.logo}" alt="Logo">`:""}
        <div><h2>${safe(d.empresa||"ESIP")}</h2><p>RELATÓRIO TÉCNICO DE VISITA</p></div>
      </div>
      <hr>
      <div class="grid">
        <div><b>ID:</b><br>${safe(d.id)}</div>
        <div><b>Cliente / Local:</b><br>${safe(d.cliente)}</div>
        <div><b>Responsável:</b><br>${safe(d.tecnico)}</div>
      </div>
      <div class="grid">
        <div><b>Início:</b><br>${safe(d.inicio)}</div>
        <div><b>Finalização:</b><br>${safe(d.fim)}</div>
      </div>
      <div class="box">
        ${d.obs_inicio?`<b>Observações iniciais:</b><br>${safe(d.obs_inicio)}<br><br>`:""}
        ${d.obs_fim?`<b>Observações finais:</b><br>${safe(d.obs_fim)}`:""}
      </div>
      ${d.video?`<div class="box"><b>Vídeo:</b> <a href="${safe(d.video)}">${safe(d.video)}</a></div>`:""}
      <h3>REGISTRO FOTOGRÁFICO</h3>
      <div class="fotos">
        <img src="${d.foto_inicio}" alt="Foto inicial">
        <img src="${d.foto_fim}" alt="Foto final">
      </div>
      <h3>LOCALIZAÇÃO</h3>
      <div class="box">
        <b>Início:</b> <a href="https://maps.google.com/?q=${d.lat_inicio},${d.lng_inicio}">Consultar no mapa</a><br>
        <b>Finalização:</b> <a href="https://maps.google.com/?q=${d.lat_fim},${d.lng_fim}">Consultar no mapa</a>
      </div>
      <h3>VALIDAÇÃO DO REGISTRO</h3>
      <div id="qrs"></div>
      <div class="box hash"><b>CÓDIGO DE INTEGRIDADE:</b><br>${hash}</div>
      <div class="carimbo">✔ CONCLUÍDO</div>
      <p style="text-align:center;color:#52677d;font-size:10px;margin-top:24px">Documento gerado pelo sistema ESIP • Registro local de visita técnica</p>
    </div>`;

  relatorio.style.display="block";
  try{
    const qrContainer=$("qrs");
    qrContainer.innerHTML="";
    new QRCode(qrContainer,{text:`${d.id} | ${hash}`,width:120,height:120});
    await new Promise(r=>setTimeout(r,500));
    await document.fonts.ready;
    const el=$("pdfContent");
    // Captura o relatório inteiro e encaixa proporcionalmente em UMA folha A4.
    const canvas = await html2pdf().from(el).set({
      margin: 0,
      image: {type:"jpeg", quality:0.94},
      html2canvas: {
        scale: 2, useCORS: true, backgroundColor: "#ffffff",
        logging: false, scrollX: 0, scrollY: 0
      },
      jsPDF: {unit:"mm", format:"a4", orientation:"portrait"}
    }).toCanvas().get("canvas");

    const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) ||
                       (window.jsPDF ? window.jsPDF : null);
    if (!jsPDFClass) throw new Error("Biblioteca jsPDF não disponível.");

    const doc = new jsPDFClass({unit:"mm", format:"a4", orientation:"portrait"});
    const pageW = 210, pageH = 297, margin = 7;
    const maxW = pageW - margin * 2, maxH = pageH - margin * 2;
    const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
    const imgW = canvas.width * ratio, imgH = canvas.height * ratio;
    const x = (pageW - imgW) / 2, y = (pageH - imgH) / 2;
    doc.addImage(canvas.toDataURL("image/jpeg", 0.94), "JPEG", x, y, imgW, imgH);
    doc.save(`ESIP_Relatorio_${d.id}.pdf`);
    status("PDF gerado com sucesso.");
  }catch(err){
    console.error(err);status("Falha ao gerar o PDF.");alert("Não foi possível gerar o PDF. Tente novamente.");
  }finally{
    relatorio.style.display="none";pdf.disabled=false;
  }
};
</script>
</body>
</html>
