<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Interfone Digital ESIP</title>

  <!-- PeerJS 1.5.4: sinalização WebRTC. Requer internet e página HTTPS. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; text-align: center;
    }
    .container {
      width: 100%; max-width: 420px; background: var(--card);
      padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); font-size: .95rem; margin: 0 0 20px; line-height: 1.4; }
    .video-box {
      position: relative; width: 100%; aspect-ratio: 3/4; background: #000;
      border-radius: 14px; overflow: hidden; margin-bottom: 16px; display: none;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #localVideo {
      position: absolute; bottom: 12px; right: 12px; width: 95px; height: 130px;
      border-radius: 10px; border: 2px solid var(--primary); z-index: 2;
    }
    .btn {
      width: 100%; padding: 16px; border: 0; border-radius: 12px;
      font-size: 1.05rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: .2s; margin-bottom: 10px;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #052e16; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; display: none; }
    .btn-secondary { background: #334155; color: var(--text); font-size: .9rem; padding: 12px; display: none; }
    .status {
      font-size: .85rem; padding: 10px; border-radius: 8px;
      background: rgba(255,255,255,.06); margin-bottom: 16px; color: #cbd5e1;
      line-height: 1.45;
    }
    .tts-box { display: none; gap: 8px; margin-top: 10px; }
    .tts-box input {
      min-width: 0; flex: 1; padding: 12px; border-radius: 10px;
      border: 1px solid #475569; background: #0f172a; color: white;
    }
    .tts-box button {
      padding: 0 16px; border-radius: 10px; border: 0;
      background: #3b82f6; color: white; font-weight: 600; cursor: pointer;
    }
    .hint { font-size: .78rem; margin: 12px 0 0; }
  </style>
</head>
<body>
<div class="container">
  <h1 id="titulo">🔔 Interfone Digital</h1>
  <p id="subtitulo">Toque no botão para iniciar a chamada do portão.</p>

  <div class="status" id="status" role="status" aria-live="polite">Pronto para iniciar</div>

  <div class="video-box" id="videoBox">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <button class="btn btn-primary" id="btnChamar" type="button" onclick="iniciarChamadaPortao()">
    🔔 Tocar Interfone
  </button>

  <button class="btn btn-secondary" id="btnWhatsappDireto" type="button" onclick="abrirWhatsappManual()">
    📲 Abrir WhatsApp para avisar o morador
  </button>

  <button class="btn btn-danger" id="btnEncerrar" type="button" onclick="encerrarChamada()">
    ✖ Encerrar Chamada
  </button>

  <div class="tts-box" id="ttsBox">
    <input type="text" id="ttsTexto" maxlength="250" placeholder="Digite uma mensagem para o portão..." aria-label="Mensagem para falar no portão">
    <button type="button" onclick="enviarFala()">Falar</button>
  </div>

  <p class="hint">A chamada depende de internet, HTTPS e da autorização de câmera e microfone nos dois aparelhos.</p>
</div>

<script>
  // CONFIGURAÇÃO: informe o número do morador com DDI + DDD, somente números.
  // Exemplo: 5562999999999. Não coloque +, espaços ou traços.
  const CONFIG = {
    whatsappNumero: "5562999999999",
    // Opcional. Use somente uma chave CallMeBot válida e autorizada para esse número.
    callMeBotApiKey: ""
  };

  const params = new URLSearchParams(window.location.search);
  const salaId = params.get("sala");

  let peer = null;
  let localStream = null;
  let activeCall = null;
  let dataConn = null;
  let linkChamadaAtual = "";
  let encerrando = false;

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const videoBox = $("videoBox");
  const btnChamar = $("btnChamar");
  const btnEncerrar = $("btnEncerrar");
  const btnWhatsappDireto = $("btnWhatsappDireto");

  function atualizarStatus(texto) {
    statusEl.textContent = texto;
  }

  function mostrarVideo() {
    videoBox.style.display = "block";
  }

  async function tocarVideo(video) {
    try { await video.play(); } catch (_) {
      // Alguns navegadores móveis aguardam uma interação do usuário para reproduzir mídia.
    }
  }

  function verificarAmbiente() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      atualizarStatus("Este recurso precisa ser aberto por HTTPS em um navegador compatível. Autorize câmera e microfone quando solicitado.");
      return false;
    }
    if (typeof Peer === "undefined") {
      atualizarStatus("Não foi possível carregar a biblioteca de conexão. Verifique a internet e recarregue a página.");
      return false;
    }
    return true;
  }

  window.addEventListener("load", () => {
    if (salaId) {
      $("titulo").textContent = "🏠 Atender Interfone";
      $("subtitulo").textContent = "Autorize câmera e microfone para conversar com o visitante.";
      btnChamar.style.display = "none";
      iniciarModoMorador(salaId);
    }
  });

  // VISITANTE NO PORTÃO
  async function iniciarChamadaPortao() {
    if (!verificarAmbiente()) return;

    btnChamar.disabled = true;
    atualizarStatus("Solicitando acesso à câmera e ao microfone...");

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: { facingMode: "user" }
      });
    } catch (erro) {
      atualizarStatus("Não foi possível acessar câmera/microfone. Confira as permissões do navegador e tente novamente.");
      btnChamar.disabled = false;
      return;
    }

    $("localVideo").srcObject = localStream;
    mostrarVideo();

    const idUnico = "portao-" + Math.random().toString(36).slice(2, 10);
    const urlBase = window.location.origin + window.location.pathname;
    linkChamadaAtual = `${urlBase}?sala=${encodeURIComponent(idUnico)}`;

    atualizarStatus("Preparando a chamada...");
    try {
      peer = new Peer(idUnico);
    } catch (erro) {
      atualizarStatus("Não foi possível iniciar a conexão. Tente novamente.");
      pararMidia();
      btnChamar.disabled = false;
      return;
    }

    peer.on("open", async () => {
      btnChamar.style.display = "none";
      btnEncerrar.style.display = "flex";
      atualizarStatus("Interfone pronto. Abra o WhatsApp para enviar o link ao morador.");
      await notificarMorador(linkChamadaAtual);
    });

    peer.on("call", (call) => {
      activeCall = call;
      atualizarStatus("O morador está atendendo. Conectando áudio e vídeo...");
      call.answer(localStream);

      call.on("stream", (stream) => {
        $("remoteVideo").srcObject = stream;
        tocarVideo($("remoteVideo"));
        atualizarStatus("✅ Morador conectado. Conversa ao vivo.");
      });
      call.on("close", () => {
        if (!encerrando) atualizarStatus("A chamada foi encerrada pelo outro aparelho.");
      });
      call.on("error", () => atualizarStatus("Houve uma falha na chamada. Encerre e tente novamente."));
    });

    peer.on("connection", (conn) => {
      dataConn = conn;
      conn.on("data", (mensagem) => {
        if (typeof mensagem === "string") falarEmVozAlta(mensagem.slice(0, 250));
      });
      conn.on("close", () => { dataConn = null; });
    });

    peer.on("error", (erro) => {
      console.error("PeerJS:", erro);
      if (erro.type === "unavailable-id") {
        atualizarStatus("Não foi possível reservar o identificador da chamada. Toque novamente para gerar outro.");
      } else {
        atualizarStatus("Falha na conexão com a rede de chamadas. Verifique a internet e tente novamente.");
      }
      btnWhatsappDireto.style.display = "none";
      btnChamar.style.display = "flex";
      btnChamar.disabled = false;
    });
  }

  async function notificarMorador(link) {
    const numero = String(CONFIG.whatsappNumero || "").replace(/\D/g, "");
    const mensagem = `🔔 INTERFONE TOCANDO!\nAlguém está no portão agora.\n\nAbra este link para atender:\n${link}`;

    if (CONFIG.callMeBotApiKey && CONFIG.callMeBotApiKey.trim() && numero) {
      const apiUrl = `https://api.callmebot.com/whatsapp.php?phone=${numero}&text=${encodeURIComponent(mensagem)}&apikey=${encodeURIComponent(CONFIG.callMeBotApiKey.trim())}`;
      try {
        // O modo no-cors não permite confirmar a entrega da mensagem no navegador.
        await fetch(apiUrl, { method: "GET", mode: "no-cors" });
        atualizarStatus("Solicitação de aviso enviada ao serviço de mensagens. A entrega não pode ser confirmada nesta página.");
        return;
      } catch (erro) {
        atualizarStatus("Não foi possível solicitar o aviso automático. Use o botão do WhatsApp.");
      }
    }

    btnWhatsappDireto.style.display = "flex";
    atualizarStatus("Chamada pronta. Toque em “Abrir WhatsApp” e depois envie a mensagem ao morador.");
  }

  function abrirWhatsappManual() {
    const numero = String(CONFIG.whatsappNumero || "").replace(/\D/g, "");
    if (!numero || numero.length < 10) {
      atualizarStatus("Configure o número do morador em CONFIG.whatsappNumero antes de usar o WhatsApp.");
      return;
    }
    if (!linkChamadaAtual) {
      atualizarStatus("Primeiro toque em “Tocar Interfone” para gerar o link da chamada.");
      return;
    }
    const mensagem = `Olá, estou no portão! Toque no link para atender: ${linkChamadaAtual}`;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }

  // MORADOR: abre o link recebido e conecta ao visitante.
  async function iniciarModoMorador(idDestino) {
    if (!verificarAmbiente()) return;

    atualizarStatus("Solicitando acesso à câmera e ao microfone...");
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    } catch (erro) {
      atualizarStatus("Permita o acesso à câmera e ao microfone para atender o interfone.");
      return;
    }

    $("localVideo").srcObject = localStream;
    mostrarVideo();

    try {
      peer = new Peer();
    } catch (erro) {
      atualizarStatus("Não foi possível iniciar a conexão. Recarregue a página e tente novamente.");
      pararMidia();
      return;
    }

    peer.on("open", () => {
      atualizarStatus("Chamando o aparelho do portão...");
      activeCall = peer.call(idDestino, localStream);

      if (!activeCall) {
        atualizarStatus("Não foi possível iniciar a chamada. O visitante pode ter encerrado o interfone.");
        return;
      }

      activeCall.on("stream", (stream) => {
        $("remoteVideo").srcObject = stream;
        tocarVideo($("remoteVideo"));
        atualizarStatus("✅ Conectado ao portão. Você já pode conversar.");
        btnEncerrar.style.display = "flex";
        $("ttsBox").style.display = "flex";
      });

      activeCall.on("close", () => {
        if (!encerrando) atualizarStatus("A chamada foi encerrada pelo outro aparelho.");
      });
      activeCall.on("error", () => atualizarStatus("Falha ao conectar ao portão. Verifique se o visitante ainda está aguardando."));
      dataConn = peer.connect(idDestino);
      dataConn.on("open", () => {
        // Canal pronto para mensagens de texto que serão faladas no portão.
      });
      dataConn.on("error", () => atualizarStatus("O áudio/vídeo pode funcionar, mas o canal de mensagens não conectou."));
    });

    peer.on("error", (erro) => {
      console.error("PeerJS:", erro);
      atualizarStatus("Não foi possível localizar o aparelho do portão. Confirme se o visitante ainda está aguardando e tente abrir o link novamente.");
    });
  }

  function enviarFala() {
    const input = $("ttsTexto");
    const texto = input.value.trim().slice(0, 250);
    if (!texto) return;
    if (!dataConn || dataConn.open !== true) {
      atualizarStatus("O canal de mensagens ainda não está conectado. Aguarde a conexão e tente novamente.");
      return;
    }
    dataConn.send(texto);
    input.value = "";
  }

  function falarEmVozAlta(texto) {
    if (!("speechSynthesis" in window)) {
      atualizarStatus("Este navegador não oferece leitura de texto em voz alta.");
      return;
    }
    window.speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    window.speechSynthesis.speak(fala);
  }

  function pararMidia() {
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    $("localVideo").srcObject = null;
    $("remoteVideo").srcObject = null;
  }

  function encerrarChamada() {
    encerrando = true;
    if (activeCall) { try { activeCall.close(); } catch (_) {} }
    if (dataConn) { try { dataConn.close(); } catch (_) {} }
    if (peer) { try { peer.destroy(); } catch (_) {} }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    pararMidia();
    window.location.href = window.location.pathname;
  }
</script>
</body>
</html>
