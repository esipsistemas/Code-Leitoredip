
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESIP-Sistemas - Gerador de Tokens</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
            background: #020617; color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            padding: 10px; min-height: 100vh;
        }
        .painel-admin {
            background: #0f172a; border: 2px dashed #ef4444;
            padding: 25px; border-radius: 12px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.1);
        }
        .titulo { font-size: 18px; font-weight: bold; color: #ef4444; text-align: center; }
        .subtitulo { font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        .formulario-grupo { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 12px; background: #070d1e; border: 1px solid #1e40af;
            color: #fff; border-radius: 8px; font-size: 14px; font-family: monospace;
        }
        textarea { resize: none; height: 110px; word-break: break-all; }
        button {
            width: 100%; padding: 14px; background: #7f1d1d; color: #fff;
            border: 1px solid #ef4444; border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 15px; margin-top: 5px;
        }
        button:hover { background: #ef4444; color: #020617; }
    </style>
</head>
<body>

<div class="painel-admin">
    <div class="titulo">📡 GERADOR CRIPTOGRÁFICO DE TOKENS RSA</div>
    <div class="subtitulo">Laboratório 100% Sincronizado e Autónomo</div>
    
    <div class="formulario-grupo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
            <label>Data de Vencimento:</label>
            <input type="date" id="admin-data-vencimento">
        </div>
        <div>
            <label>ID do Canal / Senha P2P:</label>
            <input type="text" id="admin-senha-camuflada" placeholder="Ex: CanalOperacional7">
        </div>
    </div>

    <button onclick="gerarNovaLicencaToken()">🧬 Assinar e Gerar Token de Acesso</button>

    <div class="formulario-grupo" style="margin-top: 20px;">
        <label>Token Criptografado Gerado:</label>
        <textarea id="admin-resultado-token" readonly placeholder="O código aparecerá aqui..."></textarea>
    </div>
</div>

<script>
// Mantida a assinatura visual que você usava no painel
const CHAVE_PRIVADA_RSA = `-----BEGIN RSA PRIVATE KEY-----
MIIBOQIBAAJBAKyZ0R5OqK1yXQpZ+L7L3vGz6vL3tX7zMvP8A/uVwF1+KAnbshzH
28RkO61x8+f4Tf7uIwIDAQABAkAAnV8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f
3N8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f3N8fAkiEA5Mf3N8f3N8f3N8f
3N8f3N8f3N8f3N8fAkiEAy8f3N8f3N8f3N8f3N8f3N8f3N8f3N8fAkiEAzsf3N8f
3N8f3N8f3N8f3N8f3N8f3N8fAkiEAzcf3N8f3N8f3N8f3N8f3N8f3N8f3N8fAkiE
Ax8f3N8f3N8f3N8f3N8f3N8f3N8f3N8f
-----END RSA PRIVATE KEY-----`;

window.onload = function() {
    document.getElementById('admin-data-vencimento').valueAsDate = new Date();
};

function gerarNovaLicencaToken() {
    let dataInput = document.getElementById('admin-data-vencimento').value;
    let senhaInput = document.getElementById('admin-senha-camuflada').value.trim();

    if (!dataInput || !senhaInput) {
        alert("Erro: Preencha os campos!");
        return;
    }

    // Monta exatamente a mesma estrutura de dados original
    let payload = {
        expira: dataInput,
        senhaCanal: senhaInput,
        timestamp: new Date().getTime()
    };

    try {
        // Motor de codificação camuflado original restaurado
        let jsonTexto = JSON.stringify(payload);
        let codificadorPrimeiroPasso = btoa(encodeURIComponent(jsonTexto));
        let tokenFinal = btoa(codificadorPrimeiroPasso.split("").reverse().join(""));
        
        // Exibe o token gerado diretamente na tela
        document.getElementById('admin-resultado-token').value = tokenFinal;
    } catch (erro) {
        alert("Erro interno: " + erro.message);
    }
}
</script>
</body>
</html>
