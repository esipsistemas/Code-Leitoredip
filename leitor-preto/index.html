<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ESIP - Rádio Tático P2P</title>
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#020617">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESIP Rádio">

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #020617;
    color: #f8fafc;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    position: relative;
}

/* =========================
   ANIMAÇÕES
========================= */

@keyframes pulsoNeonMestre {
    0%, 100% {
        box-shadow:
            0 0 5px #00f5ff,
            inset 0 0 5px #00f5ff;
        border-color: #00f5ff;
    }

    50% {
        box-shadow:
            0 0 15px #1e40af,
            inset 0 0 10px #1e40af;
        border-color: #2563eb;
    }
}

@keyframes pulsar {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }
}

/* =========================
   CABEÇALHO
========================= */

.app-header {
    background: #0b1329;
    border-bottom: 2px solid #00f5ff;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    animation: pulsoNeonMestre 4s infinite;
    flex-shrink: 0;
    min-height: 65px;
}

.logo-esip {
    font-size: 17px;
    font-weight: 900;
    color: #00f5ff;
    text-shadow: 0 0 8px #00f5ff;
    letter-spacing: 1px;
}

.status-badge {
    font-size: 10px;
    background: rgba(0, 245, 255, 0.1);
    border: 1px solid #00f5ff;
    padding: 6px 9px;
    border-radius: 20px;
    color: #00f5ff;
    font-weight: bold;
    white-space: nowrap;
}

/* =========================
   VALIDADE DO TOKEN
========================= */

#validade-token {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99998;
    background: rgba(2, 6, 23, 0.94);
    border: 1px solid #00f5ff;
    color: #00f5ff;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 12px rgba(0,245,255,.15);
    display: none;
    white-space: nowrap;
}

#validade-token.alerta {
    border-color: #fbbf24;
    color: #fbbf24;
}

#validade-token.expirada {
    border-color: #ef4444;
    color: #ef4444;
}

/* =========================
   CONTEÚDO
========================= */

.app-content {
    flex: 1;
    min-height: 0;
    padding: 12px 12px 78px 12px;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(
            circle at top,
            #0f172a 0%,
            #020617 100%
        );
    overflow: hidden;
}

.tela-aba {
    display: none;
    height: 100%;
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
}

.tela-aba.ativa {
    display: flex;
}

/* =========================
   CHAT
========================= */

.chat-box {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
    -webkit-overflow-scrolling: touch;
}

.msg {
    max-width: 84%;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.msg.enviada {
    background: #1e3a8a;
    border: 1px solid #3b82f6;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
}

.msg.recebida {
    background: #1e293b;
    border: 1px solid #475569;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
}

.chat-input-area {
    display: flex;
    gap: 8px;
    background: #0b1329;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #1e40af;
    flex-shrink: 0;
    min-height: 58px;
}

.chat-input-area input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: #fff;
    padding: 8px;
    font-size: 15px;
    outline: none;
}

.btn-send {
    background: #1e40af;
    border: 1px solid #00f5ff;
    color: white;
    padding: 10px 15px;
    min-width: 82px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}

/* =========================
   LINK
========================= */

#alerta-link-container {
    flex-shrink: 0;
}

#input-link-gerado {
    min-width: 0;
}

/* =========================
   VOZ
========================= */

.painel-chamada {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.avatar-chamada {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 3px solid #00f5ff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
}

.cronometro {
    font-size: 28px;
    font-family: monospace;
    color: #94a3b8;
    font-weight: bold;
}

.btn-call {
    background: #10b981;
    border: none;
    color: white;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    font-size: 29px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
}

.btn-call.desligar {
    background: #ef4444;
}

/* =========================
   PTT
========================= */

.painel-ptt {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
}

.btn-ptt {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(#1e40af, #0b1329);
    border: 3px dashed #00f5ff;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    text-align: center;
}

.btn-ptt.transmitindo {
    background: radial-gradient(#ef4444, #7f1d1d);
    border: 3px solid #ef4444;
    box-shadow: 0 0 35px #ef4444;
    color: #fff;
    animation: pulsar 0.8s infinite;
}

/* =========================
   ARQUIVOS
========================= */

.area-upload {
    border: 2px dashed #1e40af;
    padding: 32px 20px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    color: #94a3b8;
    background: rgba(11, 19, 41, 0.4);
    flex-shrink: 0;
    min-height: 110px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
}

.area-upload:active {
    background: rgba(30, 64, 175, 0.25);
    border-color: #00f5ff;
}

.lista-arquivos {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
}

.card-arquivo {
    background: #0b1329;
    border: 1px solid #1e40af;
    padding: 12px 13px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}

.card-arquivo span {
    min-width: 0;
    overflow-wrap: anywhere;
}

.card-arquivo a {
    color: #00f5ff;
    text-decoration: none;
    font-weight: bold;
    border: 1px solid #00f5ff;
    padding: 7px 9px;
    border-radius: 5px;
    flex-shrink: 0;
}

/* =========================
   LOCALIZAÇÃO
========================= */

.localizacao-box {
    background: #0b1329;
    border: 1px solid #1e40af;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.btn-localizacao {
    width: 100%;
    min-height: 48px;
    background: #172554;
    border: 1px solid #00f5ff;
    color: #fff;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}

.btn-localizacao:active {
    background: #1e40af;
}

/* =========================
   MENU
========================= */

.app-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(66px + env(safe-area-inset-bottom));
    background: #0b1329;
    border-top: 2px solid #1e40af;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 99999;
    padding-bottom: env(safe-area-inset-bottom);
    padding-top: 4px;
}

.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    padding: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 62px;
    touch-action: manipulation;
}

.nav-item.ativo {
    color: #00f5ff;
    text-shadow: 0 0 5px #00f5ff;
}

/* =========================
   BLOQUEIO
========================= */

#tela-bloqueio {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #020617;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.caixa-licenca {
    background: #0f172a;
    border: 2px dashed #00f5ff;
    padding: 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 450px;
    text-align: center;
}

/* =========================
   STATUS / TOAST
========================= */

#toast {
    position: fixed;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%);
    background: #0f172a;
    border: 1px solid #00f5ff;
    color: white;
    padding: 11px 15px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    z-index: 1000000;
    display: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 0 15px rgba(0,245,255,.2);
}

/* =========================
   CELULARES PEQUENOS
========================= */

@media (max-width: 360px) {
    .logo-esip {
        font-size: 14px;
    }

    .status-badge {
        font-size: 9px;
        padding: 5px;
    }

    .btn-ptt {
        width: 165px;
        height: 165px;
    }

    .avatar-chamada {
        width: 110px;
        height: 110px;
    }

    #validade-token {
        top: 66px;
        font-size: 9px;
    }
}
</style>
</head>

<script>

/* =========================================================
   VARIÁVEIS PRINCIPAIS
========================================================= */

let peer = null;
let conn = null;

let chamadaVoz = null;
let localStream = null;

let emChamada = false;
let intervalo = null;
let segundos = 0;

let hmacKey = null;

let canalAtual = null;
let tokenAtual = null;

/*
 * Token capturado pelo QR/link.
 *
 * Ele permanece somente em memória.
 * Não é gravado em banco, cookie ou localStorage.
 */
let tokenQR = null;

/*
 * ID único opcional recebido pelo QR/link.
 * Fica somente em memória.
 */
let idQR = null;

/*
 * Momento de expiração do token autenticado.
 */
let tokenExpiracao = null;

/*
 * Controle do relógio de validade.
 */
let intervaloValidade = null;

let audioContext = null;

const TAMANHO_BLOCO = 64 * 1024;

const SEMENTE_SECRETA_SISTEMA =
    "ESIP_SISTEMAS_TACTICAL_RADIO_KEY_2026";


/* =========================================================
   CAPTURA DO QR / TOKEN E LIMPEZA DA URL
========================================================= */

const urlAtual =
    new URL(window.location.href);

/*
 * Mantém os parâmetros existentes para
 * preservar o funcionamento original.
 */
const urlParams =
    new URLSearchParams(
        window.location.search
    );


/*
 * Ponta continua sendo obtida normalmente.
 */
const ponta =
    urlParams.get("p") || "1";


/*
 * Captura o token "t" assim que a página abre.
 *
 * Exemplo:
 *
 * ?p=2&t=TOKEN
 *
 * Depois disso o token é retirado
 * da barra de endereço.
 */
const tokenCapturado =
    urlParams.get("t");


if (tokenCapturado) {

    tokenQR =
        tokenCapturado.trim();

}


/*
 * Captura opcionalmente um ID único.
 *
 * Exemplo:
 *
 * ?p=2&t=TOKEN&id=ID-UNICO
 *
 * Não é obrigatório para manter
 * compatibilidade com seus tokens atuais.
 */
const idCapturado =
    urlParams.get("id");


if (idCapturado) {

    idQR =
        idCapturado.trim();

}


/*
 * Remove SOMENTE os dados sensíveis
 * da URL.
 *
 * Mantém:
 *
 * ?c=...
 * &p=...
 *
 * caso existam.
 */
if (
    tokenCapturado ||
    idCapturado
) {

    const novaURL =
        new URL(
            window.location.href
        );

    novaURL.searchParams.delete("t");
    novaURL.searchParams.delete("id");

    /*
     * O replaceState não recarrega a página.
     * O token continua disponível na variável
     * tokenQR durante a sessão atual.
     */
    window.history.replaceState(
        {},
        document.title,
        novaURL.pathname +
        (
            novaURL.searchParams.toString()
                ? "?" +
                  novaURL.searchParams.toString()
                : ""
        ) +
        novaURL.hash
    );

}

/* =========================================================
   BASE64
========================================================= */

function base64ToBuffer(
    b64
) {

    let str =
        b64
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    while (
        str.length % 4
    ) {

        str += "=";

    }

    const binary =
        atob(str);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes.buffer;
}


function bufferToBase64(
    buf
) {

    const bytes =
        new Uint8Array(buf);

    let binary =
        "";

    const tamanho =
        0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += tamanho
    ) {

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i + tamanho,
                        bytes.length
                    )
                )
            );

    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/* =========================================================
   AVISO / CONTROLE DE EXPIRAÇÃO
========================================================= */

function iniciarControleValidade(
    expiracao
) {

    clearInterval(
        intervaloValidade
    );

    tokenExpiracao =
        Number(expiracao);

    if (
        !Number.isFinite(
            tokenExpiracao
        )
    ) {

        return;

    }


    const elemento =
        document.getElementById(
            "validade-token"
        );


    elemento.style.display =
        "block";


    atualizarValidadeToken();


    intervaloValidade =
        setInterval(
            atualizarValidadeToken,
            1000
        );
}


function atualizarValidadeToken() {

    const elemento =
        document.getElementById(
            "validade-token"
        );


    if (
        !tokenExpiracao
    ) {

        elemento.style.display =
            "none";

        return;
    }


    const restante =
        tokenExpiracao -
        Date.now();


    if (
        restante <= 0
    ) {

        elemento.classList.remove(
            "alerta"
        );

        elemento.classList.add(
            "expirada"
        );

        elemento.innerText =
            "🔴 ACESSO EXPIRADO";

        clearInterval(
            intervaloValidade
        );

        expirarSessao();

        return;
    }


    const totalSegundos =
        Math.floor(
            restante / 1000
        );


    const horas =
        Math.floor(
            totalSegundos / 3600
        );

    const minutos =
        Math.floor(
            (totalSegundos % 3600) / 60
        );

    const segundosRestantes =
        totalSegundos % 60;


    const textoTempo =
        horas > 0
            ? `${String(horas).padStart(2, "0")}:` +
              `${String(minutos).padStart(2, "0")}:` +
              `${String(segundosRestantes).padStart(2, "0")}`
            : `${String(minutos).padStart(2, "0")}:` +
              `${String(segundosRestantes).padStart(2, "0")}`;


    /*
     * Últimos 5 minutos:
     * aviso visual de atenção.
     */
    if (
        restante <=
        5 * 60 * 1000
    ) {

        elemento.classList.add(
            "alerta"
        );

        elemento.innerText =
            `⚠️ ACESSO EXPIRA EM ${textoTempo}`;

    } else {

        elemento.classList.remove(
            "alerta"
        );

        elemento.classList.remove(
            "expirada"
        );

        elemento.innerText =
            `⏳ ACESSO ATIVO • EXPIRA EM ${textoTempo}`;
    }
}


function expirarSessao() {

    /*
     * Evita executar duas vezes.
     */
    if (
        document.getElementById(
            "tela-bloqueio"
        ).style.display ===
        "flex"
    ) {

        return;

    }


    console.warn(
        "[ESIP] Token expirado."
    );


    /*
     * Encerra chamada de voz.
     */
    try {

        if (chamadaVoz) {
            chamadaVoz.close();
        }

    } catch (e) {}


    /*
     * Encerra conexão de dados.
     */
    try {

        if (conn) {
            conn.close();
        }

    } catch (e) {}


    /*
     * Encerra PeerJS.
     */
    try {

        if (peer) {
            peer.destroy();
        }

    } catch (e) {}


    /*
     * Libera microfone.
     */
    try {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    } catch (e) {}


    conn =
        null;

    peer =
        null;

    chamadaVoz =
        null;

    localStream =
        null;

    emChamada =
        false;

    tokenAtual =
        null;

    tokenExpiracao =
        null;


    clearInterval(
        intervaloValidade
    );


    /*
     * Mostra novamente a autenticação.
     */
    document.getElementById(
        "tela-bloqueio"
    ).style.display =
        "flex";


    document.getElementById(
        "canal-label"
    ).innerText =
        "CHAVE OFF-LINE";


    document.querySelector(
        ".logo-esip"
    ).innerText =
        "📡 ESIP - AGUARDANDO CRIPTOGRAFIA";


    const elemento =
        document.getElementById(
            "validade-token"
        );

    elemento.classList.remove(
        "alerta"
    );

    elemento.classList.add(
        "expirada"
    );

    elemento.innerText =
        "🔴 ACESSO EXPIRADO";


    document.getElementById(
        "erro-licenca"
    ).innerText =
        "❌ O período de acesso terminou. Informe um novo token.";

    document.getElementById(
        "erro-licenca"
    ).style.display =
        "block";


    mostrarToast(
        "🔴 Acesso expirado. Nova autenticação necessária.",
        5000
    );
}


/* =========================================================
   CRIPTOGRAFIA / TOKEN
========================================================= */

async function initCrypto() {

    try {

        const encoder =
            new TextEncoder();


        const baseKeyMaterial =
            await crypto.subtle.importKey(
                "raw",
                encoder.encode(
                    SEMENTE_SECRETA_SISTEMA
                ),
                "PBKDF2",
                false,
                ["deriveKey"]
            );


        const salt =
            encoder.encode(
                "ESIP_STATIC_SALT_SALT"
            );


        hmacKey =
            await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKeyMaterial,
                {
                    name: "HMAC",
                    hash: "SHA-256",
                    length: 256
                },
                false,
                ["verify", "sign"]
            );


        /*
         * IMPORTANTE:
         *
         * Primeiro tenta recuperar o token
         * capturado do QR/link.
         *
         * O token já foi removido da URL.
         */
        const tokenParaAutenticar =
            tokenQR;


        if (
            tokenParaAutenticar
        ) {

            document.getElementById(
                "token-input"
            ).value =
                tokenParaAutenticar;


            /*
             * Autentica somente depois
             * da chave HMAC estar pronta.
             */
            await tentarAutenticar();

        }

    } catch (err) {

        console.error(
            "Erro ao iniciar criptografia:",
            err
        );
    }
}


async function tentarAutenticar() {

    const tokenStr =
        document
            .getElementById(
                "token-input"
            )
            .value
            .trim();


    const erroDiv =
        document.getElementById(
            "erro-licenca"
        );


    erroDiv.style.display =
        "none";


    /* =========================
       MODO DE TESTE ORIGINAL
    ========================= */

    if (
        tokenStr ===
        "ESIP-DEBUG"
    ) {

        document.getElementById(
            "tela-bloqueio"
        ).style.display =
            "none";


        document.getElementById(
            "validade-token"
        ).style.display =
            "none";


        inicializarPainelP2P(
            "tatico1",
            "ESIP-DEBUG"
        );


        return;
    }


    if (
        !tokenStr.includes(".")
    ) {

        erroDiv.style.display =
            "block";

        return;
    }


    try {

        if (!hmacKey) {

            /*
             * A chave já normalmente estará
             * pronta quando esta função for
             * chamada.
             */
            await initCrypto();

        }


        const partes =
            tokenStr.split(".");


        if (
            partes.length !== 2
        ) {

            throw new Error(
                "Token inválido"
            );

        }


        const payloadB64 =
            partes[0];

        const assinaturaB64 =
            partes[1];


        const assinaturaValida =
            await crypto.subtle.verify(
                "HMAC",
                hmacKey,
                base64ToBuffer(
                    assinaturaB64
                ),
                base64ToBuffer(
                    payloadB64
                )
            );


        if (
            !assinaturaValida
        ) {

            throw new Error(
                "Assinatura inválida"
            );

        }


        const dados =
            JSON.parse(
                new TextDecoder().decode(
                    base64ToBuffer(
                        payloadB64
                    )
                )
            );


        if (
            !dados.exp
        ) {

            throw new Error(
                "Token sem validade"
            );

        }


        const expiracao =
            Number(
                dados.exp
            );


        if (
            !Number.isFinite(
                expiracao
            )
        ) {

            throw new Error(
                "Validade inválida"
            );

        }


        if (
            Date.now() >=
            expiracao
        ) {

            throw new Error(
                "Token expirado"
            );

        }


        if (
            !dados.ch
        ) {

            throw new Error(
                "Canal não informado"
            );

        }


        /*
         * Guarda o token autenticado
         * somente em memória.
         */
        tokenAtual =
            tokenStr;


        /*
         * Guarda a validade real
         * informada pelo token.
         */
        tokenExpiracao =
            expiracao;


        /*
         * Inicia o aviso de validade.
         */
        iniciarControleValidade(
            expiracao
        );


        /*
         * Desbloqueia o sistema.
         */
        document.getElementById(
            "tela-bloqueio"
        ).style.display =
            "none";


        inicializarPainelP2P(
            dados.ch,
            tokenStr
        );


    } catch (err) {

        console.error(
            "Falha na autenticação:",
            err
        );


        erroDiv.innerText =
            err.message ===
            "Token expirado"
                ? "❌ Licença inválida ou expirada!"
                : "❌ Licença inválida ou expirada!";


        erroDiv.style.display =
            "block";


        /*
         * Se o token vindo do QR falhar,
         * ele não é reutilizado automaticamente.
         */
        tokenQR =
            null;

    }
}


/* =========================================================
   INICIALIZAÇÃO P2P
========================================================= */

function inicializarPainelP2P(
    canal,
    tokenOriginal
) {

    canalAtual =
        canal;

    tokenAtual =
        tokenOriginal;


    document.querySelector(
        ".logo-esip"
    ).innerText =
        `📡 ESIP - PONTA 0${ponta}`;


    document.getElementById(
        "canal-label"
    ).innerText =
        `CANAL: ${canal.toUpperCase()}`;


    /* =========================
       GERAÇÃO DO LINK DA PONTA 02
    ========================= */

    if (
        ponta === "1"
    ) {

        const linkCompleto =
            `${window.location.origin}${window.location.pathname}` +
            `?c=${encodeURIComponent(canal)}` +
            `&p=2` +
            `&t=${encodeURIComponent(tokenOriginal)}`;


        document.getElementById(
            "input-link-gerado"
        ).value =
            linkCompleto;


        document.getElementById(
            "alerta-link-container"
        ).style.display =
            "block";


        adicionarMensagem(
            "<b>[SISTEMA]</b> Link da Ponta 02 gerado. Inicializando rádio..."
        );


    } else {

        adicionarMensagem(
            "<b>[SISTEMA]</b> Inicializando tunelamento..."
        );

    }


    try {

        const meuID =
            ponta === "1"
                ? `ESIP-${canal}-MESTRE`
                : `ESIP-${canal}-CONVIDADO`;


        const idDestino =
            ponta === "1"
                ? `ESIP-${canal}-CONVIDADO`
                : `ESIP-${canal}-MESTRE`;


        /*
         * PeerJS usa o servidor público padrão.
         */
        peer =
            new Peer(meuID);


        peer.on(
            "open",
            () => {

                console.log(
                    "Peer conectado:",
                    meuID
                );


                document.getElementById(
                    "canal-label"
                ).innerText =
                    `CANAL: ${canal.toUpperCase()}`;


                if (
                    ponta === "2"
                ) {

                    conectarAoPeer(
                        idDestino
                    );

                }

            }
        );


        peer.on(
            "connection",
            novaConn => {

                console.log(
                    "Conexão recebida"
                );


                conn =
                    novaConn;


                configurarEventosConexao();

            }
        );


        peer.on(
            "call",
            async call => {

                console.log(
                    "Chamada recebida"
                );


                try {

                    await garantirMicrofone();


                    chamadaVoz =
                        call;


                    call.answer(
                        localStream
                    );


                    configurarEventosChamada();


                    emChamada =
                        true;


                    atualizarInterfaceChamada(
                        true
                    );


                    iniciarCronometro();


                    mostrarToast(
                        "📞 Chamada recebida"
                    );


                    tocarSom(
                        "chamada"
                    );


                } catch (e) {

                    console.error(e);


                    call.close();


                    mostrarToast(
                        "Não foi possível acessar o microfone."
                    );

                }

            }
        );


        peer.on(
            "error",
            err => {

                console.error(
                    "PeerJS:",
                    err
                );


                if (
                    err.type ===
                    "peer-not-found" &&
                    ponta === "2"
                ) {

                    mostrarToast(
                        "Aguardando a Ponta 01..."
                    );


                    setTimeout(
                        () => {

                            conectarAoPeer(
                                idDestino
                            );

                        },
                        3000
                    );

                }

                else if (
                    err.type ===
                    "unavailable-id"
                ) {

                    mostrarToast(
                        "Este canal já está sendo usado."
                    );

                }

            }
        );


        peer.on(
            "disconnected",
            () => {

                console.warn(
                    "Peer desconectado"
                );


                document.getElementById(
                    "canal-label"
                ).innerText =
                    "DESCONECTADO";

            }
        );


    } catch (
        errPeer
    ) {

        console.error(
            "Falha no WebRTC:",
            errPeer
        );


        adicionarMensagem(
            "<b>[ERRO]</b> Não foi possível iniciar o módulo P2P."
        );

    }
}


/* =========================================================
   CONEXÃO DE DADOS
========================================================= */

function conectarAoPeer(
    id
) {

    if (!peer) {
        return;
    }


    try {

        if (
            conn &&
            conn.open
        ) {

            return;

        }


        conn =
            peer.connect(
                id,
                {
                    reliable:
                        true
                }
            );


        configurarEventosConexao();


    } catch (err) {

        console.error(
            "Erro ao conectar:",
            err
        );

    }
}


function configurarEventosConexao() {

    if (!conn) {
        return;
    }


    /*
     * Evita registrar eventos duas vezes.
     */
    if (
        conn._esipConfigurada
    ) {

        return;

    }


    conn._esipConfigurada =
        true;


    conn.on(
        "open",
        () => {

            console.log(
                "Canal de dados aberto"
            );


            document.getElementById(
                "canal-label"
            ).innerText =
                "TÚNEL ATIVO";


            adicionarMensagem(
                "<b>[SISTEMA]</b> Conectado via WebRTC!"
            );


            tocarSom(
                "conexao"
            );

        }
    );


    conn.on(
        "data",
        dados => {

            receberDadosP2P(
                dados
            );

        }
    );


    conn.on(
        "close",
        () => {

            document.getElementById(
                "canal-label"
            ).innerText =
                "TÚNEL ENCERRADO";


            adicionarMensagem(
                "<b>[SISTEMA]</b> A outra ponta encerrou a conexão."
            );

        }
    );


    conn.on(
        "error",
        erro => {

            console.error(
                "Erro de conexão:",
                erro
            );

        }
    );
}


/* =========================================================
   RECEBIMENTO DE DADOS
========================================================= */

const transferenciasRecebidas =
    new Map();


function receberDadosP2P(
    d
) {

    if (
        !d ||
        !d.tipo
    ) {

        return;

    }


    /* =====================
       TEXTO
    ====================== */

    if (
        d.tipo ===
        "texto"
    ) {

        adicionarMensagem(
            escaparHTML(
                d.conteudo || ""
            ),
            "recebida"
        );


        tocarSom(
            "mensagem"
        );


        return;
    }


    /* =====================
       LOCALIZAÇÃO
    ====================== */

    if (
        d.tipo ===
        "localizacao"
    ) {

        const latitude =
            Number(
                d.latitude
            );

        const longitude =
            Number(
                d.longitude
            );


        if (
            !Number.isFinite(
                latitude
            ) ||
            !Number.isFinite(
                longitude
            )
        ) {

            return;

        }


        const mapa =
            `https://www.google.com/maps?q=${latitude},${longitude}`;


        adicionarMensagem(
            `📍 <b>Localização recebida</b><br>` +
            `<a href="${mapa}" target="_blank" rel="noopener" ` +
            `style="color:#00f5ff;">ABRIR NO MAPA</a>`
        );


        tocarSom(
            "mensagem"
        );


        return;
    }


    /* =====================
       INÍCIO DO ARQUIVO
    ====================== */

    if (
        d.tipo ===
        "arquivo_inicio"
    ) {

        transferenciasRecebidas.set(
            d.id,
            {
                nome:
                    d.nome,

                mime:
                    d.mime ||
                    "application/octet-stream",

                tamanho:
                    d.tamanho || 0,

                partes:
                    [],

                recebidos:
                    0
            }
        );


        adicionarMensagem(
            `📥 Recebendo arquivo: <b>${escaparHTML(d.nome)}</b>`
        );


        return;
    }


    /* =====================
       BLOCO DO ARQUIVO
    ====================== */

    if (
        d.tipo ===
        "arquivo_bloco"
    ) {

        const transferencia =
            transferenciasRecebidas.get(
                d.id
            );


        if (
            !transferencia
        ) {

            return;

        }


        transferencia.partes[
            d.indice
        ] =
            d.conteudo;


        transferencia.recebidos +=
            d.tamanho || 0;


        return;
    }


    /* =====================
       FINAL DO ARQUIVO
    ====================== */

    if (
        d.tipo ===
        "arquivo_fim"
    ) {

        const transferencia =
            transferenciasRecebidas.get(
                d.id
            );


        if (
            !transferencia
        ) {

            return;

        }


        finalizarArquivoRecebido(
            d.id,
            transferencia
        );

    }
}


/* =========================================================
   FINALIZAÇÃO DO ARQUIVO
========================================================= */

function finalizarArquivoRecebido(
    id,
    transferencia
) {

    try {

        const blob =
            new Blob(
                transferencia.partes,
                {
                    type:
                        transferencia.mime
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card-arquivo";


        const nomeSeguro =
            escaparHTML(
                transferencia.nome
            );


        card.innerHTML =
            `
            <span>
                📄 ${nomeSeguro}
            </span>

            <a
                href="${url}"
                download="${nomeSeguro}">
                BAIXAR
            </a>
            `;


        document.getElementById(
            "container-arquivos"
        ).appendChild(
            card
        );


        adicionarMensagem(
            `📁 Arquivo recebido: <b>${nomeSeguro}</b>`
        );


        tocarSom(
            "arquivo"
        );


        transferenciasRecebidas.delete(
            id
        );


    } catch (err) {

        console.error(
            "Erro ao montar arquivo:",
            err
        );


        adicionarMensagem(
            "❌ Erro ao reconstruir o arquivo recebido."
        );

    }
}


/* =========================================================
   CHAT
========================================================= */

function enviarTextoP2P() {

    const input =
        document.getElementById(
            "input-mensagem"
        );


    const texto =
        input.value.trim();


    if (!texto) {
        return;
    }


    if (
        !conn ||
        !conn.open
    ) {

        mostrarToast(
            "Conecte as duas pontas primeiro."
        );


        return;
    }


    conn.send({
        tipo:
            "texto",

        conteudo:
            texto
    });


    adicionarMensagem(
        escaparHTML(texto),
        "enviada"
    );


    input.value =
        "";


    tocarSom(
        "mensagem"
    );
}


/* =========================================================
   ARQUIVOS
========================================================= */

async function enviarArquivoP2P(
    input
) {

    if (
        !input ||
        !input.files ||
        input.files.length === 0
    ) {

        return;

    }


    const arquivo =
        input.files[0];


    if (
        !conn ||
        !conn.open
    ) {

        mostrarToast(
            "Conecte as duas pontas antes de enviar o arquivo."
        );


        input.value =
            "";


        return;
    }


    const id =
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2);


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card-arquivo";


    card.id =
        "arquivo-envio-" +
        id;


    card.innerHTML =
        `
        <span>
            📤 ${escaparHTML(arquivo.name)}
        </span>

        <span
            style="color:#fbbf24;"
            id="progresso-${id}">
            0%
        </span>
        `;


    document.getElementById(
        "container-arquivos"
    ).appendChild(
        card
    );


    try {

        conn.send({
            tipo:
                "arquivo_inicio",

            id:
                id,

            nome:
                arquivo.name,

            mime:
                arquivo.type ||
                "application/octet-stream",

            tamanho:
                arquivo.size
        });


        let indice =
            0;


        for (
            let inicio = 0;
            inicio < arquivo.size;
            inicio += TAMANHO_BLOCO
        ) {

            const fim =
                Math.min(
                    inicio +
                    TAMANHO_BLOCO,
                    arquivo.size
                );


            const bloco =
                await arquivo
                    .slice(
                        inicio,
                        fim
                    )
                    .arrayBuffer();


            conn.send({
                tipo:
                    "arquivo_bloco",

                id:
                    id,

                indice:
                    indice,

                tamanho:
                    bloco.byteLength,

                conteudo:
                    bloco
            });


            indice++;


            const percentual =
                Math.round(
                    (
                        fim /
                        arquivo.size
                    ) *
                    100
                );


            const progresso =
                document.getElementById(
                    "progresso-" +
                    id
                );


            if (progresso) {

                progresso.innerText =
                    percentual +
                    "%";

            }


            await pausa(2);
        }


        conn.send({
            tipo:
                "arquivo_fim",

            id:
                id
        });


        const progressoFinal =
            document.getElementById(
                "progresso-" +
                id
            );


        if (
            progressoFinal
        ) {

            progressoFinal.innerText =
                "Enviado";


            progressoFinal.style.color =
                "#10b981";

        }


        adicionarMensagem(
            `📁 Enviou arquivo: <b>${escaparHTML(arquivo.name)}</b>`,
            "enviada"
        );


        tocarSom(
            "arquivo"
        );


    } catch (erro) {

        console.error(
            "Erro no envio:",
            erro
        );


        const progresso =
            document.getElementById(
                "progresso-" +
                id
            );


        if (
            progresso
        ) {

            progresso.innerText =
                "Erro";


            progresso.style.color =
                "#ef4444";

        }


        mostrarToast(
            "Erro ao enviar o arquivo."
        );


    } finally {

        input.value =
            "";

    }
}


function pausa(
    ms
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

function enviarLocalizacao() {

    if (
        !conn ||
        !conn.open
    ) {

        mostrarToast(
            "Conecte as duas pontas primeiro."
        );


        return;
    }


    if (
        !navigator.geolocation
    ) {

        mostrarToast(
            "Este navegador não oferece localização."
        );


        return;
    }


    mostrarToast(
        "Obtendo sua localização..."
    );


    navigator.geolocation.getCurrentPosition(

        posicao => {

            const latitude =
                posicao.coords.latitude;


            const longitude =
                posicao.coords.longitude;


            const precisao =
                posicao.coords.accuracy;


            conn.send({
                tipo:
                    "localizacao",

                latitude:
                    latitude,

                longitude:
                    longitude,

                precisao:
                    precisao,

                hora:
                    Date.now()
            });


            const mapa =
                `https://www.google.com/maps?q=${latitude},${longitude}`;


            adicionarMensagem(
                `📍 <b>Minha localização enviada</b><br>` +
                `<a href="${mapa}" target="_blank" rel="noopener" ` +
                `style="color:#00f5ff;">ABRIR NO MAPA</a>`,
                "enviada"
            );


            mostrarToast(
                "📍 Localização enviada."
            );


            tocarSom(
                "mensagem"
            );

        },


        erro => {

            console.error(
                "Geolocalização:",
                erro
            );


            if (
                erro.code ===
                1
            ) {

                mostrarToast(
                    "Permissão de localização negada."
                );

            } else {

                mostrarToast(
                    "Não foi possível obter a localização."
                );

            }

        },


        {
            enableHighAccuracy:
                false,

            timeout:
                15000,

            maximumAge:
                30000
        }
    );
}

async function copiarLinkPonta2() {

            );

            "🔗 Link da Ponta 02 copiado."
        );


    } catch (erro) {

        console.error(
            erro

        mostrarToast(

    }
}

/* =========================================================
   MICROFONE
========================================================= */

async function garantirMicrofone() {

    if (
        localStream &&
        localStream.active
    ) {

        return localStream;

    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Microfone não suportado."
        );

    }


    localStream =
        await navigator.mediaDevices.getUserMedia(
            {
                audio: {
                    echoCancellation:
                        true,

                    noiseSuppression:
                        true,

                    autoGainControl:
                        true
                },

                video:
                    false
            }
        );


    mudeMicrofonePTT(
        false
    );


    return localStream;
}


function mudeMicrofonePTT(
    estado
) {

    if (!localStream) {
        return;
    }


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    estado;

            }
        );
}


/* =========================================================
   CHAMADA DE VOZ
========================================================= */

async function alternarChamada() {

    const btn =
        document.getElementById(
            "controle-chamada"
        );


    const crono =
        document.getElementById(
            "tempo-chamada"
        );


    const ava =
        document.getElementById(
            "avatar-status"
        );


    if (
        !peer ||
        peer.destroyed
    ) {

        mostrarToast(
            "O rádio ainda não está conectado."
        );


        return;
    }


    if (
        !conn ||
        !conn.open
    ) {

        mostrarToast(
            "Conecte a outra ponta primeiro."
        );


        return;
    }


    if (
        !emChamada
    ) {

        try {

            await garantirMicrofone();


            const dest =
                ponta === "1"
                    ? `ESIP-${canalAtual}-CONVIDADO`
                    : `ESIP-${canalAtual}-MESTRE`;


            chamadaVoz =
                peer.call(
                    dest,
                    localStream
                );


            configurarEventosChamada();


            emChamada =
                true;


            mudeMicrofonePTT(
                false
            );


            atualizarInterfaceChamada(
                true
            );


            iniciarCronometro();


            document.getElementById(
                "status-ptt-texto"
            ).innerText =
                "Walkie-Talkie Pronto.";


            tocarSom(
                "chamada"
            );


        } catch (e) {

            console.error(e);


            mostrarToast(
                "Permita o acesso ao microfone."
            );

        }


    } else {

        encerrarChamada();

    }
}


function configurarEventosChamada() {

    if (
        !chamadaVoz
    ) {

        return;

    }


    chamadaVoz.on(
        "stream",
        stream => {

            const audio =
                document.getElementById(
                    "audio-remoto"
                );


            audio.srcObject =
                stream;


            audio.play()
                .catch(
                    () => {}
                );

        }
    );


    chamadaVoz.on(
        "close",
        () => {

            encerrarChamada(
                false
            );

        }
    );


    chamadaVoz.on(
        "error",
        erro => {

            console.error(
                "Chamada:",
                erro
            );

        }
    );
}


function atualizarInterfaceChamada(
    ativa
) {

    const btn =
        document.getElementById(
            "controle-chamada"
        );


    const ava =
        document.getElementById(
            "avatar-status"
        );


    if (
        ativa
    ) {

        btn.classList.add(
            "desligar"
        );


        btn.innerText =
            "📵";


        ava.innerText =
            "🗣️";


    } else {

        btn.classList.remove(
            "desligar"
        );


        btn.innerText =
            "📞";


        ava.innerText =
            "👤";

    }
}


function iniciarCronometro() {

    clearInterval(
        intervalo
    );


    segundos =
        0;


    document.getElementById(
        "tempo-chamada"
    ).innerText =
        "00:00";


    intervalo =
        setInterval(
            () => {

                segundos++;


                const minutos =
                    Math.floor(
                        segundos / 60
                    );


                const seg =
                    segundos %
                    60;


                document.getElementById(
                    "tempo-chamada"
                ).innerText =
                    `${String(minutos).padStart(2, "0")}:` +
                    `${String(seg).padStart(2, "0")}`;

            },
            1000
        );
}


function encerrarChamada(
    fecharPeer = true
) {

    if (
        fecharPeer &&
        chamadaVoz
    ) {

        try {

            chamadaVoz.close();

        } catch (e) {}

    }


    clearInterval(
        intervalo
    );


    chamadaVoz =
        null;


    emChamada =
        false;


    mudeMicrofonePTT(
        false
    );


    atualizarInterfaceChamada(
        false
    );


    document.getElementById(
        "tempo-chamada"
    ).innerText =
        "00:00";


    document.getElementById(
        "status-ptt-texto"
    ).innerText =
        "O PTT requer o Canal de Voz Ativo";


    const audio =
        document.getElementById(
            "audio-remoto"
        );


    audio.srcObject =
        null;
}


/* =========================================================
   PTT
========================================================= */

function iniciarTransmissaoPTT(
    e
) {

    if (e) {
        e.preventDefault();
    }


    if (
        !emChamada ||
        !localStream
    ) {

        mostrarToast(
            "Inicie o canal de voz primeiro."
        );


        return;
    }


    const btn =
        document.getElementById(
            "btn-ptt-trigger"
        );


    btn.classList.add(
        "transmitindo"
    );


    document.getElementById(
        "ptt-icone"
    ).innerText =
        "⚡";


    document.getElementById(
        "ptt-label"
    ).innerHTML =
        "TRANSMITINDO";


    mudeMicrofonePTT(
        true
    );


    tocarSom(
        "ptt"
    );
}


function cessarTransmissaoPTT(
    e
) {

    if (e) {
        e.preventDefault();
    }


    if (
        !localStream ||
        !emChamada
    ) {

        return;
    }


    const btn =
        document.getElementById(
            "btn-ptt-trigger"
        );


    if (
        btn.classList.contains(
            "transmitindo"
        )
    ) {

        btn.classList.remove(
            "transmitindo"
        );


        document.getElementById(
            "ptt-icone"
        ).innerText =
            "🎙️";


        document.getElementById(
            "ptt-label"
        ).innerHTML =
            "PRESSIONE<br>PARA FALAR";


        mudeMicrofonePTT(
            false
        );

    }
}


/* =========================================================
   SONS
========================================================= */

function prepararAudio() {

    try {

        if (
            !audioContext
        ) {

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioCtx) {
                return;
            }


            audioContext =
                new AudioCtx();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


    } catch (e) {

        console.warn(
            "Áudio:",
            e
        );

    }
}


function tocarSom(
    tipo
) {

    try {

        prepararAudio();


        if (
            !audioContext
        ) {

            return;

        }


        const agora =
            audioContext.currentTime;


        const osc =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        osc.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        let frequencia =
            600;


        let duracao =
            0.08;


        if (
            tipo ===
            "mensagem"
        ) {

            frequencia =
                700;

            duracao =
                0.08;

        }

        else if (
            tipo ===
            "conexao"
        ) {

            frequencia =
                900;

            duracao =
                0.15;

        }

        else if (
            tipo ===
            "arquivo"
        ) {

            frequencia =
                500;

            duracao =
                0.12;

        }

        else if (
            tipo ===
            "chamada"
        ) {

            frequencia =
                1000;

            duracao =
                0.18;

        }

        else if (
            tipo ===
            "ptt"
        ) {

            frequencia =
                800;

            duracao =
                0.05;

        }


        osc.frequency.value =
            frequencia;


        osc.type =
            "sine";


        gain.gain.setValueAtTime(
            0.0001,
            agora
        );


        gain.gain.exponentialRampToValueAtTime(
            0.08,
            agora + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            agora + duracao
        );


        osc.start(
            agora
        );


        osc.stop(
            agora +
            duracao
        );


    } catch (e) {

        console.warn(
            "Não foi possível tocar som:",
            e
        );

    }
}


/* =========================================================
   EVENTOS DO CELULAR
========================================================= */

document.addEventListener(
    "touchstart",
    () => {

        prepararAudio();

    },
    {
        once:
            true,

        passive:
            true
    }
);


/* =========================================================
   ENCERRAMENTO DA PÁGINA
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            clearInterval(
                intervaloValidade
            );


            if (
                chamadaVoz
            ) {

                chamadaVoz.close();

            }


            if (
                conn
            ) {

                conn.close();

            }


            if (
                peer
            ) {

                peer.destroy();

            }


            if (
                localStream
            ) {

                localStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }


        } catch (e) {}

    }
);
