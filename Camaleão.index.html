<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESIP-Sistemas - Cliente</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071426;
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:380px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin:10px 0 5px;
    color:#00d9ff;
}

.subtitulo{
    text-align:center;
    color:#9fb4c8;
    font-size:13px;
    margin-bottom:25px;
}

.card{
    background:#0d2038;
    border:1px solid #193a5d;
    border-radius:15px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #315777;
    background:#06101e;
    color:#fff;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    margin-top:8px;
}

.btn-login{
    background:#00bfe8;
    color:#00131c;
}

.btn-login:hover{
    background:#00d9ff;
}

.btn-alerta{
    background:#e60000;
    color:#fff;
    font-size:22px;
    padding:22px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(255,0,0,.35);
}

.btn-alerta:active{
    transform:scale(.98);
}

.btn-comanda{
    background:#17466d;
    color:#fff;
}

.btn-comanda:hover{
    background:#1c5b8d;
}

.hidden{
    display:none!important;
}

.status{
    margin:12px 0;
    padding:10px;
    border-radius:8px;
    background:#081827;
    color:#9edfff;
    font-size:13px;
    text-align:center;
}

.gps{
    margin-top:12px;
    padding:12px;
    background:#06101e;
    border-radius:10px;
    border:1px solid #193a5d;
    font-size:12px;
    line-height:1.6;
    word-break:break-word;
}

.licenca{
    text-align:center;
    color:#7e9bb4;
    font-size:11px;
    margin-top:15px;
}

.logo{
    text-align:center;
    font-size:28px;
    margin-bottom:4px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">📡</div>
    <h1>ESIP-Sistemas</h1>
    <div class="subtitulo">Central de Gestão de Segurança</div>

    <!-- LOGIN -->
    <div id="login" class="card">

        <h3 style="text-align:center;">Acesso do Cliente</h3>

        <input
            type="text"
            id="licenca"
            placeholder="Digite sua licença"
            autocomplete="off"
        >

        <button class="btn-login" onclick="entrar()">
            ENTRAR
        </button>

        <div class="licenca">
            Acesso protegido ESIP-Sistemas
        </div>
    </div>


    <!-- SISTEMA -->
    <div id="sistema" class="hidden">

        <div class="card">

            <h3 id="nomeCliente" style="text-align:center;"></h3>

            <div id="statusConexao" class="status">
                Conectando...
            </div>

            <div id="gpsStatus" class="status">
                Obtendo localização GPS...
            </div>

            <div id="gpsDados" class="gps">
                Latitude: aguardando...<br>
                Longitude: aguardando...
            </div>

            <div id="moduloSeguranca" class="hidden">

                <button
                    id="btnPanico"
                    class="btn-alerta"
                    onclick="enviarAlerta('🚨 PÂNICO')"
                >
                    🚨 BOTÃO DE PÂNICO
                </button>

            </div>


            <div id="moduloComanda" class="hidden">

                <h3 style="text-align:center;">
                    Solicitação
                </h3>

                <button
                    class="btn-comanda"
                    onclick="enviarAlerta('🍽️ FOME')"
                >
                    🍽️ FOME
                </button>

                <button
                    class="btn-comanda"
                    onclick="enviarAlerta('🚻 BANHEIRO')"
                >
                    🚻 BANHEIRO
                </button>

                <button
                    class="btn-comanda"
                    onclick="enviarAlerta('🥤 SEDE')"
                >
                    🥤 SEDE
                </button>

                <button
                    class="btn-comanda"
                    onclick="enviarAlerta('🆘 AJUDA')"
                >
                    🆘 AJUDA
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const API_KEY =
"VCXCEuvhGcBDP7XhiJZUDoxe9WwMDYvsBzctGqpO";


const LICENCAS = {

    "FARMACIA-TESTE":{
        nicho:"seguranca",
        vencimento:"2027-12-31",
        nome:"Farmácia Centro"
    },

    "RESTAURANTE-OK":{
        nicho:"comanda",
        vencimento:"2027-06-15",
        nome:"Bistrô Premium"
    },

    "VENCIDA-999":{
        nicho:"seguranca",
        vencimento:"2025-01-01",
        nome:"Cliente Antigo"
    }

};


/* =========================================================
   VARIÁVEIS
========================================================= */

let socket = null;

let localizacaoAtual = null;

let watchID = null;

let licencaAtual = null;


/* =========================================================
   LOGIN
========================================================= */

function entrar(){

    const campo =
        document.getElementById("licenca");

    const chave =
        campo.value.trim().toUpperCase();

    if(!chave){

        alert("Digite sua licença.");

        return;
    }


    const cliente =
        LICENCAS[chave];


    if(!cliente){

        alert("Licença inválida.");

        return;
    }


    const hoje =
        new Date();

    const vencimento =
        new Date(cliente.vencimento + "T23:59:59");


    if(hoje > vencimento){

        alert(
            "Esta licença está vencida."
        );

        return;
    }


    licencaAtual = chave;


    document
        .getElementById("login")
        .classList.add("hidden");


    document
        .getElementById("sistema")
        .classList.remove("hidden");


    document
        .getElementById("nomeCliente")
        .innerText =
        cliente.nome;


    if(cliente.nicho === "seguranca"){

        document
            .getElementById("moduloSeguranca")
            .classList.remove("hidden");

    }


    if(cliente.nicho === "comanda"){

        document
            .getElementById("moduloComanda")
            .classList.remove("hidden");

    }


    iniciarGPS();

    conectarWebSocket();

}


/* =========================================================
   GPS
========================================================= */

function iniciarGPS(){

    const status =
        document.getElementById("gpsStatus");


    if(!navigator.geolocation){

        status.innerText =
            "❌ Este navegador não possui suporte a GPS.";

        return;
    }


    status.innerText =
        "📡 Solicitando permissão de localização...";


    watchID =
        navigator.geolocation.watchPosition(

            function(posicao){

                const latitude =
                    posicao.coords.latitude;

                const longitude =
                    posicao.coords.longitude;


                localizacaoAtual = {

                    latitude:latitude,

                    longitude:longitude,

                    precisao:
                        posicao.coords.accuracy

                };


                document
                    .getElementById("gpsStatus")
                    .innerText =
                    "🟢 GPS ATIVO";


                document
                    .getElementById("gpsDados")
                    .innerHTML =
                    "Latitude: " +
                    latitude.toFixed(6) +
                    "<br>" +
                    "Longitude: " +
                    longitude.toFixed(6) +
                    "<br>" +
                    "Precisão aproximada: " +
                    Math.round(
                        posicao.coords.accuracy
                    ) +
                    " metros";


            },

            function(erro){

                let mensagem =
                    "❌ Não foi possível obter o GPS.";


                if(erro.code === 1){

                    mensagem =
                        "❌ Permissão de localização negada.";

                }

                else if(erro.code === 2){

                    mensagem =
                        "❌ Localização indisponível.";

                }

                else if(erro.code === 3){

                    mensagem =
                        "❌ Tempo esgotado para obter GPS.";

                }


                document
                    .getElementById("gpsStatus")
                    .innerText =
                    mensagem;

            },

            {

                enableHighAccuracy:true,

                maximumAge:5000,

                timeout:15000

            }

        );

}


/* =========================================================
   WEBSOCKET
========================================================= */

function conectarWebSocket(){

    const sala =
        licencaAtual;


    const url =
        "wss://free.blr2.piesocket.com/v3/" +
        encodeURIComponent(sala) +
        "?api_key=" +
        encodeURIComponent(API_KEY) +
        "&notify_self=1";


    document
        .getElementById("statusConexao")
        .innerText =
        "🟡 Conectando à central...";


    try{

        socket =
            new WebSocket(url);


        socket.onopen =
            function(){

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🟢 CENTRAL CONECTADA";

            };


        socket.onclose =
            function(){

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🔴 CENTRAL DESCONECTADA";

            };


        socket.onerror =
            function(){

                document
                    .getElementById("statusConexao")
                    .innerText =
                    "🔴 ERRO NA CONEXÃO";

            };


        socket.onmessage =
            function(event){

                console.log(
                    "Mensagem recebida:",
                    event.data
                );

            };


    }

    catch(erro){

        console.error(erro);

        document
            .getElementById("statusConexao")
            .innerText =
            "🔴 Falha ao conectar.";

    }

}


/* =========================================================
   ENVIO DO ALERTA
========================================================= */

function enviarAlerta(comando){

    if(!socket){

        alert(
            "A conexão com a central ainda não foi iniciada."
        );

        return;
    }


    if(socket.readyState !== WebSocket.OPEN){

        alert(
            "A central não está conectada."
        );

        return;
    }


    /*
       NÃO envia alerta sem GPS.
    */

    if(!localizacaoAtual){

        alert(
            "Aguarde o GPS obter sua localização antes de enviar o alerta."
        );

        return;
    }


    const latitude =
        localizacaoAtual.latitude;

    const longitude =
        localizacaoAtual.longitude;


    const mapa =
        "https://www.google.com/maps?q=" +
        latitude +
        "," +
        longitude;


    const dados = {

        status:"ALERTA_CRITICO",

        mensagem:comando,

        hora:
            new Date()
            .toLocaleTimeString(
                "pt-BR"
            ),

        licenca:
            licencaAtual,

        localizacao:{

            latitude:latitude,

            longitude:longitude,

            precisao:
                localizacaoAtual.precisao,

            mapa_link:mapa

        }

    };


    try{

        socket.send(
            JSON.stringify(dados)
        );


        alert(
            "Alerta enviado para a central."
        );


        console.log(
            "ALERTA ENVIADO:",
            dados
        );

    }

    catch(erro){

        console.error(erro);

        alert(
            "Erro ao enviar o alerta."
        );

    }

}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("licenca")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                entrar();

            }

        }
    );

</script>

</body>
</html>
