
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESIP-Sistemas</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #071424;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container-app {
            background: #0d233a;
            padding: 30px;
            border-radius: 22px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .marca-header {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .marca-sub {
            font-size: 11px;
            color: #74b9ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #a4b0be;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #071424;
            border: 2px solid #1e3d59;
            border-radius: 10px;
            font-size: 16px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #74b9ff;
        }

        .btn-principal {
            width: 100%;
            padding: 14px;
            background: #74b9ff;
            color: #071424;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-principal:hover {
            opacity: 0.9;
        }

        .erro-box {
            display: none;
            background: #ff4757;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .escondido {
            display: none !important;
        }

        /* Botão de pânico com efeito pulsante */
        .btn-panico {
            width: 160px;
            height: 160px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulsar 2s infinite linear;
        }

        @keyframes pulsar {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 71, 87, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0);
            }
        }

        .grid-acessibilidade {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .btn-fala {
            background: #1e3d59;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .btn-fala:hover {
            background: #274d70;
        }

        /* Badge e barra de localização visual */
        .badge-gps {
            background: #2ed573;
            color: #071424;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 15px;
        }

        .info-localizacao {
            margin-top: 20px;
            background: #071424;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #a4b0be;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="container-app">

        <div class="marca-header">ESIP-Sistemas</div>
        <span class="marca-sub">Soluções Digitais</span>

        <!-- TELA 1: LOGIN -->
        <div id="tela-login">

            <p style="color: #a4b0be; font-size: 13px; margin-bottom: 20px;">
                Insira sua licença para ativar o sistema móvel.
            </p>

            <div id="erro-login" class="erro-box"></div>

            <div class="input-group">
                <label>CHAVE DE ATIVAÇÃO / LICENÇA</label>

                <input
                    type="text"
                    id="chave-licenca"
                    placeholder="Ex: FARMACIA-TESTE"
                    autocomplete="off"
                >
            </div>

            <button class="btn-principal" onclick="processarLogin()">
                Ativar Licença
            </button>

        </div>


        <!-- TELA 2: PAINEL PRINCIPAL -->
        <div id="tela-principal" class="escondido">

            <div class="badge-gps">
                <span>📍</span>
                GPS MONITORADO
            </div>

            <h3
                id="titulo-cliente"
                style="color: #74b9ff; margin: 0 0 5px 0;"
            ></h3>

            <p
                id="subtitulo-cliente"
                style="color: #a4b0be; font-size: 12px; margin: 0 0 15px 0;"
            ></p>

            <div id="conteudo-dinamico"></div>

            <!-- Box visual inferior mostrando que a localização está ativa -->
            <div class="info-localizacao">
                <span>🌐</span>
                <span id="coordenadas-texto">
                    Buscando localização atual...
                </span>
            </div>

        </div>

    </div>


    <script>

        /* ==============================
           LICENÇAS
        ============================== */

        const LICENCAS = {

            "FARMACIA-TESTE": {
                nicho: "seguranca",
                vencimento: "2027-12-31",
                nome: "Farmácia Centro"
            },

            "RESTAURANTE-OK": {
                nicho: "comanda",
                vencimento: "2027-06-15",
                nome: "Bistrô Premium"
            },

            "VENCIDA-999": {
                nicho: "seguranca",
                vencimento: "2025-01-01",
                nome: "Cliente Antigo"
            }

        };


        /* ==============================
           VARIÁVEIS
        ============================== */

        let socket = null;

        let localizacaoAtual = {
            latitude: null,
            longitude: null
        };


        /* ==============================
           LOGIN
        ============================== */

        function processarLogin() {

            const chave = document
                .getElementById('chave-licenca')
                .value
                .trim()
                .toUpperCase();

            const erroBox = document.getElementById('erro-login');

            erroBox.style.display = "none";
            erroBox.innerText = "";


            /* Licença inexistente */

            if (!LICENCAS[chave]) {

                erroBox.innerText = "🚨 Licença não encontrada";
                erroBox.style.display = "block";

                return;
            }


            const dados = LICENCAS[chave];


            /* Verificação de validade */

            const dataVencimento = new Date(
                dados.vencimento + "T23:59:59"
            );

            if (new Date() > dataVencimento) {

                erroBox.innerText =
                    "🚨 Data inválida (Licença Expirada)";

                erroBox.style.display = "block";

                return;
            }


            /* Login aprovado */

            carregarPainelCliente(dados, chave);
        }


        /* ==============================
           CARREGAR PAINEL
        ============================== */

        function carregarPainelCliente(cliente, chave) {

            document
                .getElementById('tela-login')
                .classList.add('escondido');

            document
                .getElementById('tela-principal')
                .classList.remove('escondido');


            document
                .getElementById('titulo-cliente')
                .innerText = cliente.nome.toUpperCase();


            const containerDinamico =
                document.getElementById('conteudo-dinamico');


            /* ==============================
               MÓDULO SEGURANÇA
            ============================== */

            if (cliente.nicho === "seguranca") {

                document
                    .getElementById('subtitulo-cliente')
                    .innerText = "Módulo: Botão de Pânico";


                containerDinamico.innerHTML = `
                    <button
                        class="btn-panico"
                        onclick="enviarSinal('ALERTA_DE_PANICO', this)"
                    >
                        🚨 DISPARAR
                    </button>
                `;
            }


            /* ==============================
               MÓDULO COMANDA
            ============================== */

            else if (cliente.nicho === "comanda") {

                document
                    .getElementById('subtitulo-cliente')
                    .innerText = "Módulo: Voz Amiga Assistiva";


                containerDinamico.innerHTML = `
                    <div class="grid-acessibilidade">

                        <button
                            class="btn-fala"
                            onclick="falarEEnviar('Estou com fome', this)"
                        >
                            <span>🍲</span>
                            FOME
                        </button>


                        <button
                            class="btn-fala"
                            onclick="falarEEnviar('Preciso ir ao banheiro', this)"
                        >
                            <span>🚾</span>
                            BANHEIRO
                        </button>


                        <button
                            class="btn-fala"
                            onclick="falarEEnviar('Estou com sede', this)"
                        >
                            <span>💧</span>
                            SEDE
                        </button>


                        <button
                            class="btn-fala"
                            onclick="falarEEnviar('Preciso de ajuda', this)"
                        >
                            <span>🚨</span>
                            AJUDA
                        </button>

                    </div>
                `;
            }


            /* Inicializa GPS */

            inicializarGps();


            /* ==============================
               WEBSOCKET
            ============================== */

            try {

                /*
                 * CORREÇÃO:
                 * A URL original estava quebrada.
                 *
                 * Mantida a intenção de utilizar
                 * o PieSocket.
                 */

                socket = new WebSocket(
                    `wss://free.blr2.piesocket.com/v3/${chave}?api_key=VCXCEuvhGcBDP7XhiJZUDoxe9WwMDYvsBzctGqpO&notify_self=1`
                );


                socket.onopen = function () {

                    console.log(
                        "Conectado ao servidor de transmissão."
                    );

                };


                socket.onerror = function (e) {

                    console.log(
                        "Erro na conexão WebSocket. Operando localmente."
                    );

                };


                socket.onclose = function () {

                    console.log(
                        "Conexão WebSocket encerrada."
                    );

                };

            }

            catch (e) {

                console.log(
                    "Falha ao inicializar WebSocket. Operando localmente."
                );

            }
        }


        /* ==============================
           GPS
        ============================== */

        function inicializarGps() {

            if ("geolocation" in navigator) {

                navigator.geolocation.watchPosition(

                    function (posicao) {

                        localizacaoAtual.latitude =
                            posicao.coords.latitude;

                        localizacaoAtual.longitude =
                            posicao.coords.longitude;


                        document
                            .getElementById('coordenadas-texto')
                            .innerText =
                            `Lat: ${localizacaoAtual.latitude.toFixed(5)} | Lon: ${localizacaoAtual.longitude.toFixed(5)}`;

                    },


                    function (erro) {

                        console.log(
                            "Erro ao obter GPS:",
                            erro.message
                        );


                        const texto =
                            document.getElementById(
                                'coordenadas-texto'
                            );

                        texto.innerText =
                            "Permissão de GPS necessária";

                        texto.style.color = "#ff4757";

                    },


                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 5000
                    }

                );

            }

            else {

                document
                    .getElementById('coordenadas-texto')
                    .innerText =
                    "GPS não suportado neste aparelho";

            }
        }


        /* ==============================
           ENVIO DO SINAL
        ============================== */

        function enviarSinal(comando, btn) {

            let mapaLink = "Sem GPS";


            if (
                localizacaoAtual.latitude !== null &&
                localizacaoAtual.longitude !== null
            ) {

                mapaLink =
                    `https://www.google.com/maps?q=${localizacaoAtual.latitude},${localizacaoAtual.longitude}`;

            }


            const pacote = {

                status: "ALERTA_CRITICO",

                mensagem: comando,

                hora: new Date().toLocaleTimeString('pt-BR'),

                localizacao: {

                    latitude:
                        localizacaoAtual.latitude,

                    longitude:
                        localizacaoAtual.longitude,

                    mapa_link:
                        mapaLink

                }

            };


            /* Envia pelo WebSocket */

            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify(pacote)
                );

            }


            console.log(
                "Pacote Enviado:",
                pacote
            );


            /* Feedback visual */

            if (btn) {

                const txtOriginal =
                    btn.innerHTML;


                const ehPanico =
                    btn.classList.contains(
                        'btn-panico'
                    );


                if (ehPanico) {

                    btn.style.animation = 'none';

                }


                btn.innerHTML = "✓ ENVIADO";

                btn.style.background =
                    "#2ed573";


                setTimeout(function () {

                    btn.innerHTML =
                        txtOriginal;


                    btn.style.background =
                        ehPanico
                            ? "#ff4757"
                            : "#1e3d59";


                    if (ehPanico) {

                        btn.style.animation =
                            'pulsar 2s infinite linear';

                    }

                }, 1000);

            }

        }


        /* ==============================
           VOZ + ENVIO
        ============================== */

        function falarEEnviar(texto, btn) {

            if (
                'speechSynthesis' in window
            ) {

                const fala =
                    new SpeechSynthesisUtterance(
                        texto
                    );

                fala.lang = 'pt-BR';

                window.speechSynthesis.speak(
                    fala
                );

            }


            enviarSinal(
                texto,
                btn
            );

        }


        /* ==============================
           ENTER NO LOGIN
        ============================== */

        document
            .getElementById('chave-licenca')
            .addEventListener(
                'keydown',
                function(event) {

                    if (event.key === "Enter") {

                        processarLogin();

                    }

                }
            );

    </script>

</body>
</html>
```
